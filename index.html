        ctx.beginPath();
        ctx.moveTo(-obs.width/4, -obs.height); ctx.lineTo(-obs.width/4, -obs.height - 40);
        ctx.moveTo(obs.width/4, -obs.height); ctx.lineTo(obs.width/4, -obs.height - 40);
        ctx.moveTo(0, -obs.height/2); ctx.lineTo(0, -obs.height/2 - 60);
        ctx.globalAlpha = alpha * 0.5; ctx.lineWidth = 2; ctx.stroke();
      } else if (obs.type === OT.GATE) {
        const pulse = 0.7 + 0.3 * Math.sin(this.gameTime * 10);
        ctx.globalAlpha = pulse;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(ox - obs.width/2, obs.y - obs.height/2); ctx.lineTo(ox + obs.width/2, obs.y - obs.height/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox - obs.width/2, obs.y + obs.height/2); ctx.lineTo(ox + obs.width/2, obs.y + obs.height/2); ctx.stroke();
        ctx.globalAlpha = 0.2;
        ctx.fillRect(ox - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
      }
      ctx.restore();
    }
  }

  // ── Risk / Reward Portal visuals ──────────────────────────────────────────
  _drawPortals(ctx) {
    for (const p of this.portals) {
      const ox = this._laneX(p.lane);
      const pulse = 0.6 + 0.4 * Math.sin(p.pulsePhase);
      ctx.save();
      ctx.translate(ox, p.y);

      // Outer glowing rings (reads clearly as "special / dangerous")
      for (let ring = 0; ring < 3; ring++) {
        ctx.beginPath();
        ctx.arc(0, 0, p.radius * (0.55 + ring * 0.28) * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(180,0,255,${0.55 - ring * 0.15})`;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 20; ctx.shadowColor = '#aa00ff';
        ctx.stroke();
      }

      // Glowing core
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.radius);
      grad.addColorStop(0,   'rgba(255,255,255,0.9)');
      grad.addColorStop(0.4, 'rgba(200,0,255,0.65)');
      grad.addColorStop(1,   'rgba(150,0,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, p.radius, 0, Math.PI * 2); ctx.fill();

      // Label so the player instantly reads it as risky/optional
      ctx.textAlign = 'center';
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#ffccff';
      ctx.shadowBlur = 8; ctx.shadowColor = '#aa00ff';
      ctx.fillText('⚠ RISK', 0, -p.radius - 12);
      ctx.restore();
    }
  }

  // ── Neon Coin visuals ──────────────────────────────────────────────────────
  _drawCoins(ctx) {
    for (const c of this.coins) {
      const ox = this._laneX(c.lane);
      const bob = Math.sin(c.phase) * 6;
      const squash = Math.max(0.25, Math.abs(Math.cos(c.spin)));

      ctx.save();
      ctx.translate(ox, c.y + bob);

      // Outer glow halo
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, c.radius * 2.2);
      grad.addColorStop(0,   'rgba(255,215,0,0.55)');
      grad.addColorStop(0.5, 'rgba(255,180,0,0.18)');
      grad.addColorStop(1,   'rgba(255,180,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, c.radius * 2.2, 0, Math.PI * 2); ctx.fill();

      // Coin body (squashed on X to fake a spinning disc)
      ctx.scale(squash, 1);
      ctx.shadowBlur = 14; ctx.shadowColor = '#ffd700';
      ctx.fillStyle = '#ffe066';
      ctx.strokeStyle = '#ffb700';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, c.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#fff8dc';
      ctx.font = `bold ${Math.floor(c.radius * 1.1)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¢', 0, 1);
      ctx.textBaseline = 'alphabetic';

      ctx.restore();
    }
  }

  _drawRiskOverlay(ctx) {
    if (this.riskPhase === 'IDLE') return;
    const a = this.riskIntensity;
    if (a <= 0) return;
    ctx.save();

    // Strong pulsing red/violet vignette - unmistakably a heightened state
    const grad = ctx.createRadialGradient(
      this.width/2, this.height/2, this.height * 0.18,
      this.width/2, this.height/2, this.height * 0.78
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(140,0,70,${0.4 * a})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.width, this.height);

    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 180);
    ctx.fillStyle = `rgba(220,0,140,${0.06 * a * pulse})`;
    ctx.fillRect(0, 0, this.width, this.height);

    ctx.restore();
  }

  _drawParticles(ctx) {
    for (const p of this.particles) {
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle   = p.color;
      ctx.shadowBlur  = 10; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // ── Dynamic Event visuals ─────────────────────────────────────────────────
  _drawGlitchOverlay(ctx) {
    if (this.dynType !== 'GLITCH' || this.dynPhase === 'IDLE' || this.dynPhase === 'WARNING') return;
    const a = this.dynIntensity;
    if (a <= 0) return;
    ctx.save();

    // Color shift wash (hue cycles for an electric feel)
    const hue = (Date.now() / 4) % 360;
    ctx.fillStyle = `hsla(${hue},100%,55%,${0.06 * a})`;
    ctx.fillRect(0, 0, this.width, this.height);

    // Glitch slices (RGB-split style bands)
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.glitchSlices) {
      ctx.fillStyle = g.color;
      ctx.globalAlpha = 0.18 * a;
      ctx.fillRect(g.dx, g.y, this.width, g.h);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // Faint scanlines
    ctx.strokeStyle = `rgba(0,255,255,${0.05 * a})`;
    ctx.lineWidth = 1;
    for (let y = 0; y < this.height; y += 4) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke();
    }

    ctx.restore();
  }

  _drawBlackoutOverlay(ctx) {
    if (this.dynType !== 'BLACKOUT' || this.dynPhase === 'IDLE' || this.dynPhase === 'WARNING') return;
    const a = this.dynIntensity;
    if (a <= 0) return;
    ctx.save();

    ctx.fillStyle = `rgba(0,0,0,${0.96 * a})`;
    ctx.fillRect(0, 0, this.width, this.height);

    // Punch a soft circle of light around the player
    ctx.globalCompositeOperation = 'destination-out';
    const r = Math.max(this.width, this.height) * 0.16;
    const holeGrad = ctx.createRadialGradient(this.playerX, this.playerY, 0, this.playerX, this.playerY, r);
    holeGrad.addColorStop(0, `rgba(0,0,0,${a})`);
    holeGrad.addColorStop(0.65, `rgba(0,0,0,${0.55 * a})`);
    holeGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = holeGrad;
    ctx.beginPath();
    ctx.arc(this.playerX, this.playerY, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // ── Level Up celebration ──────────────────────────────────────────────────
  _drawLevelUpEffect(ctx) {
    if (this.levelUpTimer <= 0) return;
    const T = 2.4;
    const t = 1 - (this.levelUpTimer / T);      // 0 -> 1 over the effect's lifetime
    const cx = this.width / 2, cy = this.height * 0.38;

    ctx.save();

    // Expanding ring burst
    const ringCount = 3;
    for (let i = 0; i < ringCount; i++) {
      const delay = i * 0.12;
      const rt = Math.max(0, Math.min(1, (t - delay) / 0.85));
      if (rt <= 0) continue;
      const r = rt * (this.width * 0.5);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,215,0,${(1 - rt) * 0.6})`;
      ctx.lineWidth = 4;
      ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
      ctx.stroke();
    }

    // Pop-in / fade-out text
    const inT  = Math.min(1, t / 0.18);
    const outT = Math.max(0, Math.min(1, (t - 0.75) / 0.25));
    const scale = (0.6 + 0.4 * inT) * (1 + 0.15 * Math.sin(t * Math.PI * 6) * (1 - t));
    const alpha = inT * (1 - outT);

    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';

    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffd700';
    ctx.fillText('LEVEL UP', 0, -22);

    ctx.font = 'bold 56px monospace';
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 24;
    ctx.fillText(`${this.levelUpLevel}`, 0, 40);

    ctx.restore();
  }

  // ── Main Menu: layout ─────────────────────────────────────────────────────
  _getMenuLayout() {
    const w = this.width, h = this.height;
    const mobile = w < 720;

    const chipW = mobile ? (w - 60) / 2 : 150;
    const chipH = 44;
    const chipGap = 10;
    const chipsY = h * 0.40;
    const chipIds = ['level', 'coins', 'highscore', 'games'];
    const chips = chipIds.map((id, i) => {
      if (mobile) {
        const col = i % 2, row = Math.floor(i / 2);
        return { id, x: 30 + col * (chipW + chipGap), y: chipsY + row * (chipH + chipGap), w: chipW, h: chipH };
      }
      const totalW = chipW * 4 + chipGap * 3;
      return { id, x: w / 2 - totalW / 2 + i * (chipW + chipGap), y: chipsY, w: chipW, h: chipH };
    });
    const chipsBottom = mobile ? chipsY + chipH * 2 + chipGap : chipsY + chipH;

    const playBtn = { id: 'play', label: 'PLAY', x: w / 2 - 120, y: chipsBottom + 26, w: 240, h: 58 };

    const secondary = [
      { id: 'shop',         label: 'SHOP' },
      { id: 'challenges',   label: 'DAILY CHALLENGES' },
      { id: 'achievements', label: 'ACHIEVEMENTS' },
      { id: 'statistics',   label: 'STATISTICS' },
      { id: 'settings',     label: 'SETTINGS' }
    ];
    const secCols = mobile ? 1 : 3;
    const secGap = 10;
    const secW = mobile ? (w - 60) : (Math.min(w * 0.72, 620) - secGap * (secCols - 1)) / secCols;
    const secH = 42;
    const secBlockW = secW * secCols + secGap * (secCols - 1);
    const secStartX = mobile ? 30 : w / 2 - secBlockW / 2;
    const secStartY = playBtn.y + playBtn.h + 22;
    const secButtons = secondary.map((s, i) => {
      const col = i % secCols, row = Math.floor(i / secCols);
      return { ...s, x: secStartX + col * (secW + secGap), y: secStartY + row * (secH + secGap), w: secW, h: secH };
    });

    return { mobile, chips, playBtn, secButtons };
  }

  _drawMenu(ctx) {
    const ML = this._getMenuLayout();

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px monospace';
    const text = 'NEON RUNNER';
    let tx = this.width / 2 - (ctx.measureText(text).width / 2);
    for (let i = 0; i < text.length; i++) {
      const cycle = (Date.now() / 500 + i * 0.2) % (Math.PI * 2);
      const r = Math.floor(170 * (Math.sin(cycle) + 1) / 2);
      const g = Math.floor(255 * (1 - (Math.sin(cycle) + 1) / 2));
      const b = 255;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
      const charW = ctx.measureText(text[i]).width;
      ctx.fillText(text[i], tx + charW / 2, this.height * 0.20);
      tx += charW;
    }
    ctx.shadowBlur = 0;
    ctx.font = '16px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('HOW FAR CAN YOU GO?', this.width / 2, this.height * 0.25);

    // Stat chips
    const chipLabels = {
      level:     { label: 'LEVEL',      value: `${this.profile.level}`,             color: '#66ddff' },
      coins:     { label: 'COINS',      value: `¢ ${this.profile.coins}`,           color: '#ffd700' },
      highscore: { label: 'HIGH SCORE', value: `${this.highScore}`,                 color: '#00ffff' },
      games:     { label: 'GAMES',      value: `${this.profile.gamesPlayed}`,       color: '#ff66cc' }
    };
    for (const c of ML.chips) {
      const info = chipLabels[c.id];
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.strokeStyle = info.color; ctx.lineWidth = 1.5;
      ctx.shadowBlur = 8; ctx.shadowColor = info.color;
      this._roundRectPath(ctx, c.x, c.y, c.w, c.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.textAlign = 'center';
      ctx.font = '9px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(info.label, c.x + c.w / 2, c.y + 16);
      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = info.color;
      ctx.fillText(info.value, c.x + c.w / 2, c.y + 34);
    }

    // Play button
    const btnPulse = this.menuHoverPlay ? 1.06 + 0.02 * Math.sin(Date.now() / 150) : 1;
    ctx.save();
    ctx.translate(ML.playBtn.x + ML.playBtn.w / 2, ML.playBtn.y + ML.playBtn.h / 2);
    ctx.scale(btnPulse, btnPulse);
    ctx.strokeStyle = '#00ffff';
    ctx.fillStyle = this.menuHoverPlay ? 'rgba(0,255,255,0.22)' : 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2.5;
    ctx.shadowBlur = this.menuHoverPlay ? 22 : 15; ctx.shadowColor = '#00ffff';
    this._roundRectPath(ctx, -ML.playBtn.w / 2, -ML.playBtn.h / 2, ML.playBtn.w, ML.playBtn.h, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
    ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
    ctx.fillText('PLAY', 0, 9);
    ctx.restore();

    // Secondary nav buttons
    for (let i = 0; i < ML.secButtons.length; i++) {
      const b = ML.secButtons[i];
      const hover = this.menuHoverSecondary === i;
      ctx.fillStyle = hover ? 'rgba(255,0,255,0.14)' : 'rgba(0,0,0,0.45)';
      ctx.strokeStyle = hover ? '#ff00ff' : '#4400aa';
      ctx.lineWidth = hover ? 2 : 1;
      ctx.shadowBlur = hover ? 12 : 0; ctx.shadowColor = '#ff00ff';
      this._roundRectPath(ctx, b.x, b.y, b.w, b.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = hover ? '#ff88ff' : '#ccc';
      ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
    }
  }

  // ── Game Over: layout ─────────────────────────────────────────────────────
  _getGameOverLayout() {
    const w = this.width, h = this.height;
    const panelW = Math.min(480, w - 40);
    const panelX = w / 2 - panelW / 2;
    const panelY = h * 0.07;
    const panelH = Math.min(h - panelY - 16, 600);

    const btnGap = 12;
    const btnW = (panelW - 40 - btnGap * 2) / 3;
    const btnY = panelY + panelH - 58;
    const buttons = [
      { id: 'continue', label: 'CONTINUE', x: panelX + 20, y: btnY, w: btnW, h: 44 },
      { id: 'restart',  label: 'RESTART',  x: panelX + 20 + btnW + btnGap, y: btnY, w: btnW, h: 44 },
      { id: 'menu',     label: 'MENU',     x: panelX + 20 + (btnW + btnGap) * 2, y: btnY, w: btnW, h: 44 }
    ];
    return { panelX, panelY, panelW, panelH, buttons };
  }

  _drawGameOver(ctx) {
    const GL = this._getGameOverLayout();
    const goFade = Math.min(1, (Date.now() - this.gameOverStartTime) / 500);
    const scaleIn = 0.94 + 0.06 * goFade;

    ctx.save();
    ctx.globalAlpha = goFade;
    ctx.translate(GL.panelX + GL.panelW / 2, GL.panelY + GL.panelH / 2);
    ctx.scale(scaleIn, scaleIn);
    ctx.translate(-(GL.panelX + GL.panelW / 2), -(GL.panelY + GL.panelH / 2));

    // Gold starburst behind the panel for new records
    if (this.newRecord) {
      ctx.save();
      ctx.translate(GL.panelX + GL.panelW / 2, GL.panelY + 36);
      ctx.rotate(Date.now() / 1000);
      const pulse = 1 + 0.2 * Math.sin(Date.now() / 200);
      ctx.scale(pulse, pulse);
      ctx.strokeStyle = '#ffd700';
      ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
      ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(0, 60); ctx.stroke();
        ctx.rotate(Math.PI / 6);
      }
      ctx.restore();
    }

    // Panel
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    this._roundRectPath(ctx, GL.panelX, GL.panelY, GL.panelW, GL.panelH, 14);
    ctx.fill();
    ctx.strokeStyle = this.newRecord ? '#ffd700' : '#ff0055'; ctx.lineWidth = 2;
    this._roundRectPath(ctx, GL.panelX, GL.panelY, GL.panelW, GL.panelH, 14);
    ctx.stroke();

    const cx = GL.panelX + GL.panelW / 2;
    let y = GL.panelY + 42;

    ctx.textAlign = 'center';
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = this.newRecord ? '#ffd700' : '#ff0055';
    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
    ctx.fillText(this.newRecord ? 'NEW RECORD!' : 'GAME OVER', cx, y);
    ctx.shadowBlur = 0;
    y += 28;

    // Motivational message banner
    const msg = this.motivationalMessage;
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = msg.color; ctx.shadowBlur = 6; ctx.shadowColor = msg.color;
    ctx.fillText(msg.text, cx, y);
    ctx.shadowBlur = 0;
    y += 26;

    // Animated score + best score
    ctx.font = 'bold 40px monospace';
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 12; ctx.shadowColor = '#00ffff';
    ctx.fillText(`${this.gameOverScoreDisplay}`, cx, y + 30);
    ctx.shadowBlur = 0;
    ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('FINAL SCORE', cx, y + 46);
    ctx.font = '12px monospace'; ctx.fillStyle = '#aaa';
    ctx.fillText(`BEST  ${this.highScore}`, cx, y + 64);
    y += 88;

    // Two-column stat grid
    const lx = cx - 14, rx = cx + 14;
    const rowH = 21;
    const rows = [
      ['DISTANCE',  `${Math.floor(this.distanceTraveled)}m`, 'SURVIVAL',  `${Math.floor(this.gameTime / 60).toString().padStart(2,'0')}:${Math.floor(this.gameTime % 60).toString().padStart(2,'0')}`],
      ['COMBO',     `x${this.maxComboReached}`,               'NEAR MISS', `${this.nearMissCount}`],
      ['OBJECTIVES',`${this.activeObjectives.filter(o=>o.completed).length}/${this.activeObjectives.length}`, 'LEVEL', `${this.profile.level}`]
    ];
    ctx.font = '12px monospace';
    for (const [l1, v1, l2, v2] of rows) {
      ctx.textAlign = 'right'; ctx.fillStyle = '#888';
      ctx.fillText(l1 + ':', lx - 60, y);
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
      ctx.fillText(v1, lx - 55, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#888';
      ctx.fillText(l2 + ':', rx + 70, y);
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
      ctx.fillText(v2, rx + 75, y);
      y += rowH;
    }
    y += 6;

    // Coins / XP earned this run
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px monospace';
    ctx.fillStyle = '#ffd700'; ctx.shadowBlur = 6; ctx.shadowColor = '#ffd700';
    ctx.fillText(`+${this.gameOverCoinsDisplay} COINS`, cx - 80, y);
    ctx.fillStyle = '#66ddff'; ctx.shadowColor = '#66ddff';
    ctx.fillText(`+${this.gameOverXPDisplay} XP`, cx + 60, y);
    ctx.shadowBlur = 0;
    y += 20;

    // Progress to next level bar
    const need = this.profile.xpForLevel(this.profile.level);
    const prog = Math.max(0, Math.min(1, this.profile.xp / need));
    const barW = GL.panelW - 60;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(cx - barW / 2, y, barW, 8);
    ctx.fillStyle = '#66ddff'; ctx.shadowBlur = 6; ctx.shadowColor = '#66ddff';
    ctx.fillRect(cx - barW / 2, y, barW * prog, 8);
    ctx.shadowBlur = 0;
    ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`PROGRESS TO LEVEL ${this.profile.level + 1}`, cx, y + 20);

    // Buttons
    for (const b of GL.buttons) {
      const hover = this.gameOverHoverBtn === GL.buttons.indexOf(b);
      const disabled = b.id === 'continue' && this.profile.coins < 50;
      const col = b.id === 'continue' ? (disabled ? '#663333' : '#00ffff') : b.id === 'restart' ? '#ff00ff' : '#888';
      ctx.fillStyle = hover && !disabled ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.5)';
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.shadowBlur = hover && !disabled ? 12 : 5; ctx.shadowColor = col;
      this._roundRectPath(ctx, b.x, b.y, b.w, b.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.font = 'bold 12px monospace';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 4);
      if (b.id === 'continue') {
        ctx.font = '9px monospace'; ctx.fillStyle = disabled ? '#994444' : 'rgba(255,255,255,0.6)';
        ctx.fillText('¢ 50', b.x + b.w / 2, b.y + b.h + 12);
      }
    }

    ctx.restore();
  }

  // ── Generic side panels: rendering ────────────────────────────────────────
  _drawPanel(ctx) {
    const L = this._getPanelLayout();

    ctx.save();
    ctx.fillStyle = 'rgba(5,5,15,0.55)';
    ctx.fillRect(0, 0, this.width, this.height);

    const titles = {
      STATISTICS: 'STATISTICS', ACHIEVEMENTS: 'ACHIEVEMENTS',
      SETTINGS: 'SETTINGS', CHALLENGES: 'DAILY CHALLENGES'
    };
    ctx.textAlign = 'left';
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 14; ctx.shadowColor = '#00ffff';
    ctx.fillText(titles[this.state] || '', L.backBtn.x + L.backBtn.w + 20, L.backBtn.y + 26);

    ctx.shadowBlur = this.panelHoverBack ? 12 : 6; ctx.shadowColor = '#ff0055';
    ctx.strokeStyle = '#ff0055';
    ctx.fillStyle = this.panelHoverBack ? 'rgba(255,0,85,0.2)' : 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    this._roundRectPath(ctx, L.backBtn.x, L.backBtn.y, L.backBtn.w, L.backBtn.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillText('< BACK', L.backBtn.x + L.backBtn.w / 2, L.backBtn.y + L.backBtn.h / 2 + 5);

    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.strokeStyle = '#4400aa'; ctx.lineWidth = 1;
    this._roundRectPath(ctx, L.panelX, L.panelY, L.panelW, L.panelH, 10);
    ctx.fill(); ctx.stroke();

    if (this.state === 'STATISTICS') this._drawStatisticsPanel(ctx, L);
    else if (this.state === 'ACHIEVEMENTS') this._drawAchievementsPanel(ctx, L);
    else if (this.state === 'SETTINGS') this._drawSettingsPanel(ctx, L);
    else if (this.state === 'CHALLENGES') this._drawChallengesPanel(ctx, L);

    ctx.restore();
  }

  _drawStatisticsPanel(ctx, L) {
    const p = this.profile;
    const rows = [
      ['Player Level', `${p.level}`],
      ['Current Coins', `¢ ${p.coins}`],
      ['Total Coins Earned', `¢ ${p.totalCoinsEarned}`],
      ['Games Played', `${p.gamesPlayed}`],
      ['Highest Score', `${p.highestScore}`],
      ['Total Distance', `${Math.floor(p.totalDistance)}m`],
      ['Total Play Time', `${Math.floor(p.totalPlayTime / 60)}m ${Math.floor(p.totalPlayTime % 60)}s`]
    ];
    let y = L.panelY + 40;
    ctx.textAlign = 'left';
    for (const [label, value] of rows) {
      ctx.font = '13px monospace'; ctx.fillStyle = '#aaa';
      ctx.fillText(label, L.panelX + 24, y);
      ctx.textAlign = 'right'; ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#66ddff';
      ctx.fillText(value, L.panelX + L.panelW - 24, y);
      ctx.textAlign = 'left';
      y += 40;
    }
  }

  _drawAchievementsPanel(ctx, L) {
    let y = L.panelY + 34;
    for (const a of ACHIEVEMENTS) {
      const done = a.check(this.profile);
      ctx.fillStyle = done ? 'rgba(255,215,0,0.08)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(L.panelX + 14, y - 20, L.panelW - 28, 44);
      ctx.textAlign = 'left';
      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = done ? '#ffd700' : '#888';
      ctx.fillText(done ? '\u2713 ' + a.name : '\u25CB ' + a.name, L.panelX + 24, y);
      ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(a.desc, L.panelX + 24, y + 16);
      y += 52;
    }
  }

  _drawSettingsPanel(ctx, L) {
    const rows = this._getSettingsRows();
    const soundRow = rows[0], resetRow = rows[1];

    ctx.textAlign = 'left';
    ctx.fillStyle = this.panelHoverItem === 0 ? 'rgba(0,255,255,0.1)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(soundRow.x, soundRow.y, soundRow.w, soundRow.h);
    ctx.font = 'bold 14px monospace'; ctx.fillStyle = '#fff';
    ctx.fillText('Sound', soundRow.x + 16, soundRow.y + soundRow.h / 2 + 5);
    ctx.textAlign = 'right'; ctx.fillStyle = this.profile.muted ? '#ff5555' : '#66ff99';
    ctx.fillText(this.profile.muted ? 'OFF' : 'ON', soundRow.x + soundRow.w - 16, soundRow.y + soundRow.h / 2 + 5);

    ctx.textAlign = 'left';
    ctx.fillStyle = this.panelHoverItem === 1 ? 'rgba(255,0,85,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(resetRow.x, resetRow.y, resetRow.w, resetRow.h);
    ctx.font = 'bold 14px monospace'; ctx.fillStyle = this.settingsConfirmingReset ? '#ff5555' : '#fff';
    ctx.fillText('Reset Progress', resetRow.x + 16, resetRow.y + resetRow.h / 2 + 5);
    ctx.textAlign = 'right'; ctx.font = '11px monospace'; ctx.fillStyle = '#ff5555';
    ctx.fillText(this.settingsConfirmingReset ? 'TAP AGAIN TO CONFIRM' : 'TAP TO RESET', resetRow.x + resetRow.w - 16, resetRow.y + resetRow.h / 2 + 5);
  }

  _drawChallengesPanel(ctx, L) {
    this.profile.ensureDailyChallenges();
    let y = L.panelY + 40;
    ctx.textAlign = 'left';
    for (const ch of this.profile.daily.challenges) {
      const prog = Math.min(1, ch.progress / ch.target);
      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = ch.completed ? '#ffd700' : '#fff';
      ctx.fillText((ch.completed ? '\u2713 ' : '') + ch.desc, L.panelX + 20, y);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(L.panelX + 20, y + 10, L.panelW - 40, 8);
      ctx.fillStyle = ch.completed ? '#ffd700' : '#00ff88';
      ctx.fillRect(L.panelX + 20, y + 10, (L.panelW - 40) * prog, 8);
      ctx.font = '10px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(`${Math.min(ch.progress, ch.target)}/${ch.target}${ch.completed ? '  +' + DAILY_REWARD_COINS + ' coins earned' : ''}`, L.panelX + 20, y + 34);
      y += 68;
    }
  }

  _drawUI(ctx) {
    for (const t of this.texts) {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle   = t.color;
      ctx.font        = 'bold 24px monospace';
      ctx.textAlign   = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    if (this.state === 'MENU') {
      this._drawMenu(ctx);

    } else if (this.state === 'PLAYING' || this.state === 'DEATH') {
      if (this.currentEvent === 'SCORE_SURGE' || (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE')) {
         ctx.shadowBlur = 15; ctx.shadowColor = '#ffd700'; ctx.fillStyle = '#ffd700';
      } else {
         ctx.shadowBlur = 10; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
      }
      ctx.textAlign = 'left'; ctx.font = 'bold 32px monospace';
      ctx.fillText(`SCORE: ${Math.floor(this.score)}`, 20, 40);

      // Coin counter
      ctx.shadowBlur = 8; ctx.shadowColor = '#ffd700';
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 18px monospace';
      ctx.fillText(`¢ ${this.profile.coins}`, 20, 66);

      // Level + XP progress bar
      const need = this.profile.xpForLevel(this.profile.level);
      const prog = Math.max(0, Math.min(1, this.profile.xp / need));
      ctx.shadowBlur = 0;
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = '#66ddff';
      ctx.fillText(`LV ${this.profile.level}`, 20, 90);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(70, 80, 110, 8);
      ctx.fillStyle = '#66ddff';
      ctx.shadowBlur = 8; ctx.shadowColor = '#66ddff';
      ctx.fillRect(70, 80, 110 * prog, 8);
      ctx.shadowBlur = 0;
      
      if (this.combo > 1) {
        ctx.textAlign   = 'center';
        ctx.fillStyle   = '#00ff88'; ctx.shadowColor = '#00ff88';
        ctx.fillText(`COMBO x${this.combo}`, this.width/2, 40);
      }
      
      if (this.inversionState === 'WARNING') {
        ctx.textAlign = 'center';
        ctx.fillStyle = (Math.floor(Date.now() / 150) % 2 === 0) ? '#ff0000' : '#ffffff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.font = 'bold 40px monospace';
        const sec = Math.ceil(this.inversionWarningTimer);
        ctx.fillText(`!! INVERTING IN ${sec}...`, this.width/2, this.height/2);
      } else if (this.inversionState === 'ACTIVE') {
        ctx.textAlign = 'center';
        const p = 0.5 + 0.5 * Math.sin(Date.now() / 100);
        ctx.fillStyle = `rgba(255, 0, 85, ${p})`;
        ctx.shadowColor = '#ff0055';
        ctx.font = 'bold 30px monospace';
        ctx.fillText('!! CONTROLS INVERTED !!', this.width/2, this.height/2);
      }

      // Dynamic Event warning animation (pre-activation)
      if (this.dynPhase === 'WARNING') {
        ctx.save();
        const flicker = Math.floor(Date.now() / 90) % 2 === 0;
        if (this.dynType === 'GLITCH') {
          ctx.strokeStyle = flicker ? '#ff00ff' : '#00ffff';
          ctx.lineWidth = 6;
          ctx.shadowBlur = 20; ctx.shadowColor = ctx.strokeStyle;
          ctx.strokeRect(4, 4, this.width - 8, this.height - 8);
          ctx.textAlign = 'center';
          ctx.font = 'bold 26px monospace';
          ctx.fillStyle = ctx.strokeStyle;
          ctx.fillText('SIGNAL UNSTABLE...', this.width/2, this.height * 0.42);
        } else if (this.dynType === 'BLACKOUT') {
          const t = 1 - Math.max(0, this.dynWarningTimer / 0.9);
          ctx.fillStyle = `rgba(0,0,0,${0.35 * t})`;
          ctx.fillRect(0, 0, this.width, this.height);
          ctx.textAlign = 'center';
          ctx.font = 'bold 26px monospace';
          ctx.fillStyle = flicker ? '#8888ff' : '#4444aa';
          ctx.shadowBlur = 15; ctx.shadowColor = '#4444ff';
          ctx.fillText('LIGHTS FAILING...', this.width/2, this.height * 0.42);
        } else if (this.dynType === 'SPEEDRUSH') {
          ctx.strokeStyle = flicker ? '#ffaa00' : '#ff5500';
          ctx.lineWidth = 4;
          ctx.shadowBlur = 15; ctx.shadowColor = ctx.strokeStyle;
          ctx.strokeRect(4, 4, this.width - 8, this.height - 8);
          ctx.textAlign = 'center';
          ctx.font = 'bold 26px monospace';
          ctx.fillStyle = ctx.strokeStyle;
          ctx.fillText('ENGINES CHARGING...', this.width/2, this.height * 0.42);
        }
        ctx.restore();
      }
      
      if (this.eventBannerTimer > 0) {
         ctx.save();
         ctx.textAlign = 'center';
         ctx.font = 'bold 48px monospace';
         ctx.globalAlpha = Math.min(1, this.eventBannerTimer / 0.5);
         ctx.fillStyle = '#ff00ff';
         ctx.shadowBlur = 20; ctx.shadowColor = '#ff00ff';
         ctx.fillText(this.eventBanner, this.width/2, this.height/3);
         ctx.restore();
      }

      if (this.riskPhase !== 'IDLE') {
        ctx.save();
        ctx.globalAlpha = this.riskIntensity;
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#ff0066';
        ctx.shadowBlur = 15; ctx.shadowColor = '#ff0066';
        const secs = Math.max(0, this.riskTimer).toFixed(1);
        ctx.fillText(`⚠ RISK MODE x${this.riskScoreMult} — ${secs}s`, this.width/2, 70);
        ctx.restore();
      }
      
      if (this.state === 'PLAYING') {
        ctx.save();
        ctx.translate(this.width - 130, this.height - 90);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.strokeStyle = '#4400aa';
        ctx.lineWidth = 1;
        ctx.shadowBlur = 0;
        ctx.fillRect(0, 0, 120, 80);
        ctx.strokeRect(0, 0, 120, 80);
        
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        let y = 15;
        for (const obj of this.activeObjectives) {
          if (obj.completed) {
            if (obj.flashTimer > 0) ctx.fillStyle = (Math.floor(obj.flashTimer * 10) % 2 === 0) ? '#ffd700' : '#fff';
            else ctx.fillStyle = '#888';
          } else {
            ctx.fillStyle = '#fff';
          }
          ctx.fillText(obj.text, 5, y);
          
          ctx.fillStyle = '#333';
          ctx.fillRect(5, y + 4, 110, 4);
          ctx.fillStyle = obj.completed ? '#ffd700' : '#00ff88';
          const prog = Math.min(1, obj.get() / obj.target);
          ctx.fillRect(5, y + 4, 110 * prog, 4);
          
          if (obj.completed) {
            ctx.strokeStyle = '#ffd700';
            ctx.beginPath(); ctx.moveTo(3, y - 3); ctx.lineTo(115, y - 3); ctx.stroke();
          }
          y += 25;
        }
        ctx.restore();
      }

    } else if (this.state === 'GAMEOVER') {
      this._drawGameOver(ctx);

    } else if (this.state === 'SHOP') {
      this._drawShop(ctx);

    } else if (this.state === 'STATISTICS' || this.state === 'ACHIEVEMENTS' ||
               this.state === 'SETTINGS'   || this.state === 'CHALLENGES') {
      this._drawPanel(ctx);
    }

    ctx.shadowBlur = 0;
  }
}

// ─── Bootstrap ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const engine = new GameEngine();

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  engine.resize(canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// Keyboard
window.addEventListener('keydown', e => {
  audio.init();
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') engine.handleInput('LEFT');
  if (e.code === 'ArrowRight' || e.code === 'KeyD') engine.handleInput('RIGHT');
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); engine.handleInput('ACTION'); }
});

// Mouse hover
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  engine.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  engine.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});

// Touch / click
let touchX = 0, touchY = 0, touchT = 0, touchCX = 0, touchCY = 0;
canvas.addEventListener('touchstart', e => {
  audio.init();
  const rect = canvas.getBoundingClientRect();
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
  touchCX = (touchX - rect.left) * (canvas.width / rect.width);
  touchCY = (touchY - rect.top) * (canvas.height / rect.height);
  touchT = performance.now();
}, { passive: true });

canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  const dt = performance.now() - touchT;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) && engine.state === 'PLAYING') {
    engine.handleInput(dx > 0 ? 'RIGHT' : 'LEFT');
  } else if (dt < 300) {
    engine.handleClick(touchCX, touchCY);
  }
}, { passive: true });

canvas.addEventListener('click', e => {
  audio.init();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  engine.handleClick(x, y);
});

// Game loop
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  engine.update(dt);
  engine.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
