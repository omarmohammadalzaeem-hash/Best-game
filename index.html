// ─── Audio Engine ───────────────────────────────────────────────────────────
class AudioEngine {
  constructor() { this.ctx = null; this.muted = false; }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  playTone(freq, type, duration, vol = 0.1, slideTo, offset = 0) {
    if (!this.ctx || this.muted) return;
    const osc  = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    const t = this.ctx.currentTime + offset;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t);
    osc.stop(t + duration);
  }

  laneSwitch()    { this.playTone(220, 'sine',     0.08, 0.10, 440); }
  nearMiss()      { [440,554,659].forEach((f,i) => this.playTone(f, 'square', 0.06, 0.05, undefined, i*0.06)); }
  spawn()         { this.playTone(50,  'sawtooth', 0.10, 0.03); }
  scoreMilestone(){ [523.25,659.25,783.99,1046.50].forEach((f,i) => this.playTone(f,'sine',0.15,0.10,undefined,i*0.10)); }
  highScore()     { [523.25,659.25,783.99,1046.50,1318.51].forEach((f,i) => this.playTone(f,'square',0.20,0.10,undefined,i*0.12)); }
  gameOver()      { this.playTone(440, 'sawtooth', 0.50, 0.15, 110); }
  comboUp()       { this.playTone(880, 'sine',     0.15, 0.10, 1760); }
  
  alarm(freq, duration) { this.playTone(freq, 'square', duration, 0.1); }
  restoreChime() { [523.25, 659.25, 783.99].forEach((f,i) => this.playTone(f, 'sine', 0.08, 0.1, undefined, i*0.08)); }
  comboRipple() { this.playTone(1200, 'sine', 0.1, 0.1); }
  eventAnnounce() { [220, 277, 330].forEach((f,i) => this.playTone(f, 'sawtooth', 0.4, 0.1, undefined, i*0.02)); }
  objectiveComplete() { [523.25, 659.25, 783.99, 1046.50].forEach((f,i) => this.playTone(f, 'sine', 0.12, 0.1, undefined, i*0.12)); }
  inversionStart() { this.playTone(200, 'sawtooth', 0.3, 0.15, 400); }

  // ── Dynamic Event sounds ──────────────────────────────────────────────────
  glitchWarnBlip() { this.playTone(200 + Math.random()*500, 'square', 0.03, 0.05); }
  glitchStingIn()  { this.playTone(300, 'sawtooth', 1.1, 0.08, 55); }
  glitchStingOut() { this.playTone(500, 'sine', 0.3, 0.08, 900); }
  glitchZap()      { this.playTone(80 + Math.random()*900, 'square', 0.05, 0.06); }
  blackoutHum()    { this.playTone(45 + Math.random()*15, 'sine', 1.8, 0.045); }
  blackoutIn()     { this.playTone(70, 'sine', 1.5, 0.06); }
  rushWarn()       { this.playTone(500, 'square', 0.35, 0.09, 1000); }
  rushIn()         { this.playTone(660, 'square', 0.5, 0.11, 1500); }
  rushPulse()      { this.playTone(800 + Math.random()*500, 'square', 0.07, 0.07); }

  // ── Risk / Reward Portal sounds ───────────────────────────────────────────
  portalHum()   { this.playTone(500 + Math.random()*80, 'sine', 0.5, 0.04, 700); }
  portalEnter() { [180,260,340,520,700].forEach((f,i) => this.playTone(f, 'sawtooth', 0.35, 0.11, undefined, i*0.05)); }
  riskPulse()   { this.playTone(60 + Math.random()*30, 'sawtooth', 0.5, 0.045); }
  riskEnd()     { [700,500,300].forEach((f,i) => this.playTone(f, 'sine', 0.3, 0.08, undefined, i*0.08)); }

  // ── Progression System sounds ─────────────────────────────────────────────
  coinCollect() { [988,1319].forEach((f,i) => this.playTone(f, 'sine', 0.12, 0.09, undefined, i*0.05)); }
  xpTick()      { this.playTone(700, 'triangle', 0.05, 0.04, 900); }
  levelUp()     { [523.25,659.25,783.99,1046.50,1318.51,1567.98].forEach((f,i) => this.playTone(f, 'square', 0.22, 0.11, undefined, i*0.09)); }
  purchase()    { [660,880,1108,1320].forEach((f,i) => this.playTone(f, 'sine', 0.14, 0.09, undefined, i*0.06)); }
  uiClick()     { this.playTone(500, 'triangle', 0.05, 0.06, 750); }
  uiHover()     { this.playTone(900, 'sine', 0.03, 0.02, 1000); }
}

function _dateSeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function _seededPick(seed, arr, count) {
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const pool = [...arr];
  const picked = [];
  for (let i = 0; i < count && pool.length; i++) {
    picked.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  }
  return picked;
}

// ─── Player Profile (persistent progression) ─────────────────────────────────
const PROFILE_KEY = 'neonRunnerProfile';

class PlayerProfile {
  constructor() {
    this.coins             = 0;
    this.totalCoinsEarned  = 0;
    this.gamesPlayed       = 0;
    this.totalDistance     = 0;   // in world units
    this.totalPlayTime     = 0;   // in seconds
    this.highestScore      = 0;
    this.xp                = 0;   // XP progress within current level
    this.level              = 1;

    // Cosmetics: unlocked[cat] is an array of owned ids; equipped[cat] is the active id
    this.unlocked = {
      colors: ['cyan'], shapes: ['square'], skins: ['solid'],
      trails: ['classic'], glows: ['soft']
    };
    this.equipped = { ...DEFAULT_EQUIPPED };

    this.muted = false;
    this.daily = null; // { date, challenges: [...] }

    this.load();
  }

  // XP required to advance FROM this level to the next - grows each level
  xpForLevel(level) {
    return Math.floor(100 * Math.pow(level, 1.55));
  }

  load() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && typeof data === 'object') {
          this.coins            = data.coins            ?? 0;
          this.totalCoinsEarned = data.totalCoinsEarned  ?? 0;
          this.gamesPlayed      = data.gamesPlayed       ?? 0;
          this.totalDistance    = data.totalDistance     ?? 0;
          this.totalPlayTime    = data.totalPlayTime     ?? 0;
          this.highestScore     = data.highestScore      ?? 0;
          this.xp               = data.xp                ?? 0;
          this.level             = data.level             ?? 1;

          // Merge saved cosmetics over the defaults so new catalog categories
          // introduced later never crash on old save data.
          for (const cat of Object.keys(this.unlocked)) {
            if (data.unlocked && Array.isArray(data.unlocked[cat])) {
              const valid = new Set(COSMETICS[cat].map(it => it.id));
              const owned = data.unlocked[cat].filter(id => valid.has(id));
              this.unlocked[cat] = Array.from(new Set([this.unlocked[cat][0], ...owned]));
            }
            if (data.equipped && typeof data.equipped[cat] === 'string' &&
                this.unlocked[cat].includes(data.equipped[cat])) {
              this.equipped[cat] = data.equipped[cat];
            }
          }

          this.muted = !!data.muted;
          if (data.daily && typeof data.daily === 'object') this.daily = data.daily;
        }
      }
    } catch (e) {
      // Corrupt or inaccessible storage - fall back to fresh defaults
    }
  }

  save() {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify({
        coins:            this.coins,
        totalCoinsEarned: this.totalCoinsEarned,
        gamesPlayed:      this.gamesPlayed,
        totalDistance:    this.totalDistance,
        totalPlayTime:    this.totalPlayTime,
        highestScore:     this.highestScore,
        xp:               this.xp,
        level:             this.level,
        unlocked:         this.unlocked,
        equipped:         this.equipped,
        muted:            this.muted,
        daily:            this.daily
      }));
    } catch (e) {
      // Storage may be unavailable (private browsing, quota) - fail silently
    }
  }

  addCoins(n) {
    this.coins            += n;
    this.totalCoinsEarned += n;
  }

  // Returns true if this XP grant caused one or more level-ups
  addXP(amount) {
    this.xp += amount;
    let leveledUp = false;
    while (this.xp >= this.xpForLevel(this.level)) {
      this.xp -= this.xpForLevel(this.level);
      this.level++;
      leveledUp = true;
    }
    return leveledUp;
  }

  isUnlocked(category, id) {
    return this.unlocked[category] && this.unlocked[category].includes(id);
  }

  unlockCosmetic(category, id) {
    if (!this.isUnlocked(category, id)) this.unlocked[category].push(id);
  }

  equipCosmetic(category, id) {
    if (this.isUnlocked(category, id)) this.equipped[category] = id;
  }

  // Regenerates the daily challenge set whenever the calendar date changes
  ensureDailyChallenges() {
    const today = _dateSeed();
    if (!this.daily || this.daily.date !== today) {
      const picks = _seededPick(today, CHALLENGE_POOL, 3);
      this.daily = {
        date: today,
        challenges: picks.map(p => ({
          id: p.id, desc: p.desc.replace('{t}', p.target), type: p.type,
          target: p.target, progress: 0, completed: false
        }))
      };
      this.save();
    }
  }
}

  _initSpeedLines() {
    this.speedLines = Array.from({length: 20}, () => ({
      x: Math.random() * 3000,
      y: Math.random() * 3000,
      length: 20 + Math.random() * 80,
      speed:  1.5 + Math.random() * 1.0
    }));
  }

  resize(w, h) {
    this.width   = w;
    this.height  = h;
    this.playerY = h * 0.8;
    this.targetX = this._laneX(this.playerLane);
    this.playerX = this.targetX;
  }

  _laneX(lane) {
    return this.width * (lane / 3) + (this.width / 6);
  }

  handleInput(action) {
    if (this.state === 'MENU' || this.state === 'GAMEOVER') {
      if (action === 'ACTION') this.startGame();
      return;
    }
    if (this.state === 'PLAYING') {
      // XOR the two independent inversion sources (built-in inversion event + Glitch Mode)
      const inv = this.inverted !== this.glitchInverted;
      if (action === 'LEFT')  this._movePlayer(inv ?  1 : -1);
      if (action === 'RIGHT') this._movePlayer(inv ? -1 :  1);
    }
  }

  _movePlayer(dir) {
    const nl = this.playerLane + dir;
    if (nl >= 0 && nl <= 2) {
      this.playerLane = nl;
      audio.laneSwitch();
    }
  }

  startGame() {
    this.state        = 'PLAYING';
    this.score        = 0;
    this.combo        = 1;
    this.comboCounter = 0;
    this.maxComboReached = 1;
    this.nearMissCount = 0;
    this.obstaclesDodged = 0;
    this.speed        = 400;
    this.obstacles    = [];
    this.particles.forEach(p => p.life = 0);
    this.texts        = [];
    this.playerTrail  = [];
    this.playerLane   = 1;
    this.targetX      = this._laneX(1);
    this.playerX      = this.targetX;
    this.playerVX     = 0;
    this.playerAngle  = 0;
    this.playerScale  = 1.0;
    this.settledInLane = true;
    
    this.inverted       = false;
    this.inversionState = 'IDLE';
    
    this.gameTime     = 0;
    this.nextInvertTime    = 8 + Math.random() * 12;
    this.distanceTraveled  = 0;
    this.nextSpawnDistance = 300;
    this.newRecord         = false;
    this.isHighScoring     = false;
    
    this.currentEvent = null;
    this.eventTimer = 0;
    this.eventBannerTimer = 0;
    this.gauntletRemaining = 0;
    this.ripple.active = false;

    // Reset Dynamic Events
    this.dynType = null;
    this.dynPhase = 'IDLE';
    this.dynWarningTimer = 0;
    this.dynTimer = 0;
    this.dynIntensity = 0;
    this.glitchInverted = false;
    this.glitchSlices = [];
    this.nextDynEventTime = this.gameTime + 15 + Math.random() * 15;

    // Reset Risk / Reward Portal system
    this.portals = [];
    this.nextPortalDistance = 700 + Math.random() * 400;
    this.riskPhase = 'IDLE';
    this.riskTimer = 0;
    this.riskIntensity = 0;
    this.riskScoreMult = 2;
    
    const shuffled = [...this.allObjectives].sort(() => 0.5 - Math.random());
    this.activeObjectives = shuffled.slice(0, 3).map(o => ({
      ...o, completed: false, flashTimer: 0
    }));

    // Reset progression session state (persistent totals in this.profile are untouched)
    this.coins = [];
    this.nextCoinDistance = 150 + Math.random() * 150;
    this.sessionCoinsEarned = 0;
    this.sessionXPEarned    = 0;
    this.survivalXPAccum    = 0;
    this.levelUpTimer = 0;

    this.profile.gamesPlayed++;
    this.profile.save();

    audio.spawn();
  }

  _flash(color, duration) {
    this.flashColor = color;
    this.flashTimer = duration;
  }

  _spawnParticle(x, y, vx, vy, life, color) {
    for(let i=0; i<this.particles.length; i++) {
      if (this.particles[i].life <= 0) {
        const p = this.particles[i];
        p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.color = color;
        return;
      }
    }
  }

  // ── Progression System: XP & Levels ───────────────────────────────────────
  _awardXP(amount, x, y, showText = true) {
    if (amount <= 0) return;
    this.sessionXPEarned += amount;

    if (showText) {
      this.texts.push({
        id: Math.random(), text: `+${amount} XP`, x, y,
        color: '#66ddff', life: 0.9
      });
    }

    const leveledUp = this.profile.addXP(amount);
    this.profile.save();
    if (leveledUp) this._triggerLevelUp();
  }

  _triggerLevelUp() {
    this.levelUpTimer = 2.4;
    this.levelUpLevel = this.profile.level;
    this._flash('#ffdd33', 0.5);
    audio.levelUp();
    for (let i = 0; i < 36; i++) {
      const angle = (Math.PI * 2 / 36) * i;
      const spd = 150 + Math.random() * 300;
      this._spawnParticle(this.playerX, this.playerY, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.1, '#ffd700');
    }
  }

  // ── Cosmetic Shop: geometry & hit-testing ─────────────────────────────────
  _pointInRect(x, y, r) {
    return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  _getShopLayout() {
    const w = this.width, h = this.height;
    const mobile = w < 720;
    const pad = 20;
    const backBtn   = { x: pad, y: pad, w: 90, h: 36 };
    const coinBadge = { x: w - pad - 140, y: pad, w: 140, h: 36 };

    const tabsY = pad + 50;
    const tabsH = 38;
    const tabW  = (w - pad * 2) / SHOP_CATEGORIES.length;
    const tabs = SHOP_CATEGORIES.map((c, i) => ({
      id: c.id, label: c.label,
      x: pad + i * tabW, y: tabsY, w: tabW, h: tabsH
    }));

    const contentY = tabsY + tabsH + 16;
    let gridArea, previewArea;
    if (mobile) {
      previewArea = { x: pad, y: contentY, w: w - pad * 2, h: 190 };
      gridArea    = { x: pad, y: contentY + previewArea.h + 14, w: w - pad * 2,
                       h: Math.max(120, h - (contentY + previewArea.h + 14) - pad) };
    } else {
      previewArea = { x: w - pad - 260, y: contentY, w: 260, h: h - contentY - pad };
      gridArea    = { x: pad, y: contentY, w: w - pad * 3 - 260, h: h - contentY - pad };
    }

    const items = COSMETICS[this.shopCategory];
    const cols  = mobile ? 3 : 4;
    const gap   = 12;
    const cardW = (gridArea.w - gap * (cols - 1)) / cols;
    const cardH = Math.min(112, cardW);
    const cards = items.map((item, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      return {
        item, category: this.shopCategory,
        x: gridArea.x + col * (cardW + gap),
        y: gridArea.y + row * (cardH + gap),
        w: cardW, h: cardH
      };
    });

    const actionBtn = { x: previewArea.x + 16, y: previewArea.y + previewArea.h - 54, w: previewArea.w - 32, h: 40 };

    return { mobile, backBtn, coinBadge, tabs, gridArea, previewArea, cards, actionBtn };
  }

  // ── Cosmetic Shop: click routing ──────────────────────────────────────────
  handleClick(x, y) {
    if (this.state === 'MENU') {
      const ML = this._getMenuLayout();
      if (this._pointInRect(x, y, ML.playBtn)) { audio.uiClick(); this.startGame(); return; }
      for (const b of ML.secButtons) {
        if (this._pointInRect(x, y, b)) { this._handleMenuSecondary(b.id); return; }
      }
      return;
    }
    if (this.state === 'GAMEOVER') {
      const GL = this._getGameOverLayout();
      for (const b of GL.buttons) {
        if (this._pointInRect(x, y, b)) {
          audio.uiClick();
          if (b.id === 'continue') this._continueRun();
          else if (b.id === 'restart') this.startGame();
          else if (b.id === 'menu') this.state = 'MENU';
          return;
        }
      }
      return;
    }
    if (this.state === 'SHOP') {
      this._handleShopClick(x, y);
      return;
    }
    if (this.state === 'STATISTICS' || this.state === 'ACHIEVEMENTS' ||
        this.state === 'SETTINGS'   || this.state === 'CHALLENGES') {
      this._handlePanelClick(x, y);
      return;
    }
  }

  _handleMenuSecondary(id) {
    audio.uiClick();
    if (id === 'shop')         { this._openShop('MENU'); return; }
    if (id === 'challenges')   { this._openPanel('CHALLENGES'); return; }
    if (id === 'achievements') { this._openPanel('ACHIEVEMENTS'); return; }
    if (id === 'statistics')   { this._openPanel('STATISTICS'); return; }
    if (id === 'settings')     { this._openPanel('SETTINGS'); return; }
  }

  // ── Generic side panels (Statistics / Achievements / Settings / Challenges) ──
  _openPanel(name) {
    this.panelReturnState = 'MENU';
    this.state = name;
    this.settingsConfirmingReset = false;
    if (name === 'CHALLENGES') this.profile.ensureDailyChallenges();
  }

  _closePanel() {
    this.state = this.panelReturnState || 'MENU';
    this.settingsConfirmingReset = false;
    audio.uiClick();
  }

  _getPanelLayout() {
    const w = this.width, h = this.height;
    const pad = 20;
    const backBtn = { x: pad, y: pad, w: 90, h: 36 };
    const panelX = Math.max(pad, w / 2 - Math.min(460, w - 40) / 2);
    const panelW = Math.min(460, w - 40);
    const panelY = pad + 60;
    const panelH = h - panelY - pad;
    return { backBtn, panelX, panelY, panelW, panelH };
  }

  _handlePanelClick(x, y) {
    const L = this._getPanelLayout();
    if (this._pointInRect(x, y, L.backBtn)) { this._closePanel(); return; }

    if (this.state === 'SETTINGS') {
      const rows = this._getSettingsRows();
      for (const r of rows) {
        if (this._pointInRect(x, y, r)) {
          if (r.id === 'sound') {
            this.profile.muted = !this.profile.muted;
            audio.muted = this.profile.muted;
            this.profile.save();
            audio.uiClick();
          } else if (r.id === 'reset') {
            if (this.settingsConfirmingReset) {
              this._resetProgress();
            } else {
              this.settingsConfirmingReset = true;
              this.settingsResetTimer = 4;
              audio.alarm(300, 0.15);
            }
          }
          return;
        }
      }
    }
  }

  _resetProgress() {
    try { localStorage.removeItem(PROFILE_KEY); } catch (e) {}
    this.profile = new PlayerProfile();
    this.profile.ensureDailyChallenges();
    audio.muted = this.profile.muted;
    this.settingsConfirmingReset = false;
    this._flash('#ff0044', 0.5);
    audio.gameOver();
  }

  _getSettingsRows() {
    const L = this._getPanelLayout();
    const rowH = 54, gap = 14;
    let y = L.panelY + 70;
    const rows = [
      { id: 'sound', x: L.panelX + 20, y, w: L.panelW - 40, h: rowH }
    ];
    y += rowH + gap;
    rows.push({ id: 'reset', x: L.panelX + 20, y, w: L.panelW - 40, h: rowH });
    return rows;
  }

  // ── Cosmetic Shop: open / close ───────────────────────────────────────────
  _openShop(returnState) {
    this.shopReturnState = returnState;
    this.state = 'SHOP';
    this.shopSelected = { category: this.shopCategory, id: this.profile.equipped[this.shopCategory] };
    audio.uiClick();
  }

  _closeShop() {
    this.state = this.shopReturnState || 'MENU';
    audio.uiClick();
  }

  _handleShopClick(x, y) {
    const L = this._getShopLayout();

    if (this._pointInRect(x, y, L.backBtn)) { this._closeShop(); return; }

    for (const tab of L.tabs) {
      if (this._pointInRect(x, y, tab)) {
        if (this.shopCategory !== tab.id) {
          this.shopCategory = tab.id;
          this.shopSelected = { category: tab.id, id: this.profile.equipped[tab.id] };
          audio.laneSwitch();
        }
        return;
      }
    }

    for (const card of L.cards) {
      if (this._pointInRect(x, y, card)) {
        this.shopSelected = { category: card.category, id: card.item.id };
        audio.laneSwitch();
        return;
      }
    }

    if (this._pointInRect(x, y, L.actionBtn)) {
      this._handleShopAction();
      return;
    }
  }

  _updateShopHover() {
    const L = this._getShopLayout();
    this.shopHoverBack   = this._pointInRect(this.mouseX, this.mouseY, L.backBtn);
    this.shopHoverTab    = L.tabs.findIndex(t => this._pointInRect(this.mouseX, this.mouseY, t));
    this.shopHoverCard   = L.cards.findIndex(c => this._pointInRect(this.mouseX, this.mouseY, c));
    this.shopHoverAction = this._pointInRect(this.mouseX, this.mouseY, L.actionBtn);
  }

  // ── Cosmetic Shop: buy / equip ────────────────────────────────────────────
  _handleShopAction() {
    const { category, id } = this.shopSelected;
    const item = COSMETICS[category].find(it => it.id === id);
    if (!item) return;

    const owned = this.profile.isUnlocked(category, id);
    if (!owned) {
      if (this.profile.coins >= item.price) {
        this.profile.coins -= item.price;
        this.profile.unlockCosmetic(category, id);
        this.profile.equipCosmetic(category, id);
        this.profile.save();
        this._triggerPurchaseAnim(item, category);
      } else {
        this._flash('#ff0044', 0.3);
        audio.alarm(300, 0.15);
      }
    } else {
      this.profile.equipCosmetic(category, id);
      this.profile.save();
      audio.comboUp();
    }
  }

  _triggerPurchaseAnim(item, category) {
    this.purchaseAnim = { timer: 1.4, name: item.name, color: item.hex || '#ffd700' };
    this._flash('#ffd700', 0.4);
    audio.purchase();

    const L = this._getShopLayout();
    const cx = L.previewArea.x + L.previewArea.w / 2;
    const cy = L.previewArea.y + L.previewArea.h * (L.mobile ? 0.45 : 0.28);
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 100 + Math.random() * 220;
      this._spawnParticle(cx, cy, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.0, item.hex || '#ffd700');
    }
  }

  // ── Cosmetic Shop: rendering ──────────────────────────────────────────────
  _roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  _drawShopCardIcon(ctx, category, id, cx, cy, r, animT) {
    ctx.save();
    if (category === 'colors') {
      const def = COSMETICS.colors.find(c => c.id === id);
      ctx.shadowBlur = 12; ctx.shadowColor = def.hex;
      ctx.fillStyle = def.hex;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    } else if (category === 'shapes') {
      ctx.translate(cx, cy);
      ctx.strokeStyle = '#00ffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
      ctx.lineWidth = 2; ctx.globalAlpha = 0.85;
      this._pathForShape(ctx, id, r * 1.7);
      ctx.globalAlpha = 0.15; ctx.fillStyle = '#00ffff'; ctx.fill();
      ctx.globalAlpha = 1; ctx.stroke();
    } else if (category === 'skins') {
      this._drawCosmeticPlayer(ctx, cx, cy, r * 1.6, { shapes: 'square', colors: 'cyan', skins: id, glows: 'soft' }, 0, 1, animT);
    } else if (category === 'trails') {
      ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff';
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 1 - i * 0.3;
        ctx.beginPath(); ctx.arc(cx - i * 8, cy + i * 6, 4 - i, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else if (category === 'glows') {
      this._drawCosmeticPlayer(ctx, cx, cy, r * 1.6, { shapes: 'circle', colors: 'cyan', skins: 'solid', glows: id }, 0, 1, animT);
    }
    ctx.restore();
  }

  _drawShop(ctx) {
    const L = this._getShopLayout();
    const at = Date.now() / 1000;

    ctx.save();
    ctx.fillStyle = 'rgba(5,5,15,0.55)';
    ctx.fillRect(0, 0, this.width, this.height);

    ctx.textAlign = 'left';
    ctx.font = 'bold 26px monospace';
    ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 14; ctx.shadowColor = '#00ffff';
    ctx.fillText('COSMETIC SHOP', L.backBtn.x + L.backBtn.w + 20, L.backBtn.y + 26);

    // Back button
    ctx.shadowBlur = this.shopHoverBack ? 12 : 6; ctx.shadowColor = '#ff0055';
    ctx.strokeStyle = '#ff0055';
    ctx.fillStyle = this.shopHoverBack ? 'rgba(255,0,85,0.2)' : 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2;
    this._roundRectPath(ctx, L.backBtn.x, L.backBtn.y, L.backBtn.w, L.backBtn.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillText('< BACK', L.backBtn.x + L.backBtn.w / 2, L.backBtn.y + L.backBtn.h / 2 + 5);

    // Coin badge
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffd700';
    this._roundRectPath(ctx, L.coinBadge.x, L.coinBadge.y, L.coinBadge.w, L.coinBadge.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px monospace';
    ctx.fillText(`¢ ${this.profile.coins}`, L.coinBadge.x + L.coinBadge.w / 2, L.coinBadge.y + L.coinBadge.h / 2 + 6);

    // Tabs
    for (let i = 0; i < L.tabs.length; i++) {
      const t = L.tabs[i];
      const active = t.id === this.shopCategory;
      const hover = this.shopHoverTab === i;
      ctx.fillStyle = active ? 'rgba(0,255,255,0.18)' : hover ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.35)';
      ctx.strokeStyle = active ? '#00ffff' : '#4400aa';
      ctx.lineWidth = active ? 2 : 1;
      ctx.shadowBlur = active ? 10 : 0; ctx.shadowColor = '#00ffff';
      this._roundRectPath(ctx, t.x + 3, t.y, t.w - 6, t.h, 6);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = active ? '#00ffff' : '#aaa';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(t.label, t.x + t.w / 2, t.y + t.h / 2 + 5);
    }

    // Item cards
    for (let i = 0; i < L.cards.length; i++) {
      const c = L.cards[i];
      const owned = this.profile.isUnlocked(c.category, c.item.id);
      const equipped = this.profile.equipped[c.category] === c.item.id;
      const selected = this.shopSelected.category === c.category && this.shopSelected.id === c.item.id;
      const hover = this.shopHoverCard === i;

      ctx.fillStyle = selected ? 'rgba(0,255,255,0.15)' : hover ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.4)';
      ctx.strokeStyle = equipped ? '#ffd700' : selected ? '#00ffff' : '#4400aa';
      ctx.lineWidth = equipped || selected ? 2 : 1;
      ctx.shadowBlur = equipped ? 12 : selected ? 8 : 0;
      ctx.shadowColor = equipped ? '#ffd700' : '#00ffff';
      this._roundRectPath(ctx, c.x, c.y, c.w, c.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;

      this._drawShopCardIcon(ctx, c.category, c.item.id, c.x + c.w / 2, c.y + c.h * 0.36, Math.min(c.w, c.h) * 0.22, at);

      ctx.fillStyle = '#fff'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
      ctx.fillText(c.item.name, c.x + c.w / 2, c.y + c.h * 0.68);

      if (equipped) {
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px monospace';
        ctx.fillText('EQUIPPED', c.x + c.w / 2, c.y + c.h * 0.86);
      } else if (owned) {
        ctx.fillStyle = '#66ff99'; ctx.font = '10px monospace';
        ctx.fillText('OWNED', c.x + c.w / 2, c.y + c.h * 0.86);
      } else {
        ctx.fillStyle = '#ffd700'; ctx.font = 'bold 10px monospace';
        ctx.fillText(`¢ ${c.item.price}`, c.x + c.w / 2, c.y + c.h * 0.86);
      }
    }

    // Preview panel
    const P = L.previewArea;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.strokeStyle = '#4400aa'; ctx.lineWidth = 1;
    this._roundRectPath(ctx, P.x, P.y, P.w, P.h, 10);
    ctx.fill(); ctx.stroke();

    const selItem = COSMETICS[this.shopSelected.category].find(it => it.id === this.shopSelected.id);
    const selOwned = this.profile.isUnlocked(this.shopSelected.category, this.shopSelected.id);
    const selEquipped = this.profile.equipped[this.shopSelected.category] === this.shopSelected.id;
    const previewCos = { ...this.profile.equipped, [this.shopSelected.category]: this.shopSelected.id };

    const pcx = P.x + P.w / 2;
    const pcy = P.y + (L.mobile ? P.h * 0.42 : P.h * 0.26);
    this._drawCosmeticPlayer(ctx, pcx, pcy, 46, previewCos, this.shopPreviewRot * 0.3, 1.4, at);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'center';
    ctx.fillText(selItem ? selItem.name : '', pcx, pcy + (L.mobile ? 58 : 76));

    if (selItem) {
      let label, col, glow;
      if (selEquipped) { label = 'EQUIPPED'; col = '#ffd700'; glow = false; }
      else if (selOwned) { label = 'EQUIP'; col = '#00ffff'; glow = true; }
      else { label = `BUY  ¢${selItem.price}`; col = this.profile.coins >= selItem.price ? '#ffd700' : '#ff0055'; glow = true; }

      const btn = L.actionBtn;
      const hover = this.shopHoverAction && glow;
      ctx.fillStyle = hover ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.5)';
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.shadowBlur = hover ? 14 : 8; ctx.shadowColor = col;
      this._roundRectPath(ctx, btn.x, btn.y, btn.w, btn.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.font = 'bold 14px monospace';
      ctx.fillText(label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 5);
    }

    ctx.restore();

    if (this.purchaseAnim) this._drawPurchaseAnim(ctx);
  }

  _drawPurchaseAnim(ctx) {
    const a = this.purchaseAnim;
    const t = 1 - Math.max(0, a.timer / 1.4);
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t * 1.2);
    ctx.textAlign = 'center';
    ctx.translate(this.width / 2, this.height * 0.5);
    const scale = 0.7 + 0.5 * Math.min(1, t * 4);
    ctx.scale(scale, scale);
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = a.color; ctx.shadowBlur = 20; ctx.shadowColor = a.color;
    ctx.fillText('UNLOCKED!', 0, -10);
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#fff'; ctx.shadowBlur = 10;
    ctx.fillText(a.name, 0, 22);
    ctx.restore();
  }

  // ── Progression System: Neon Coins ────────────────────────────────────────
  _maybeSpawnCoin() {
    // Coins are simple, low-friction pickups - avoid stacking them with obstacle-heavy events
    if (this.distanceTraveled < this.nextCoinDistance) return;
    const lane = Math.floor(Math.random() * 3);
    this.coins.push({
      id: Math.random(), lane, y: -70,
      radius: Math.max(13, this.width * 0.020),
      phase: Math.random() * Math.PI * 2,
      spin: 0
    });
    this.nextCoinDistance = this.distanceTraveled + 240 + Math.random() * 260;
  }

  _updateCoins(dt, spd) {
    const pSize = Math.max(20, Math.min(60, this.width * 0.04));
    for (let i = this.coins.length - 1; i >= 0; i--) {
      const c = this.coins[i];
      c.y += spd * dt;
      c.phase += dt * 5;
      c.spin  += dt * 4;

      const ox = this._laneX(c.lane);
      const dx = this.playerX - ox, dy = this.playerY - c.y;
      if (Math.sqrt(dx * dx + dy * dy) < c.radius + pSize * 0.4) {
        this._collectCoin(ox, c.y);
        this.coins.splice(i, 1);
        continue;
      }
      if (c.y > this.height + 100) this.coins.splice(i, 1);
    }
  }

  _collectCoin(x, y) {
    const coinValue = 1;
    this.profile.addCoins(coinValue);
    this.sessionCoinsEarned += coinValue;
    this.profile.save();

    for (let k = 0; k < 14; k++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 90 + Math.random() * 180;
      this._spawnParticle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, 0.6, '#ffd700');
    }
    this.texts.push({ id: Math.random(), text: '+1', x, y: y - 20, color: '#ffd700', life: 0.8 });
    audio.coinCollect();

    this._awardXP(5, x, y - 44);
  }

  _spawnWave() {
    // Dynamic Events must not overlap with the existing scripted events, each other, or Risk Mode
    if (!this.currentEvent && this.dynPhase === 'IDLE' && this.riskPhase === 'IDLE' && this.state === 'PLAYING') {
      let r = Math.random();
      if (this.score > 2000 && r < 0.04) {
        this.currentEvent = 'BLIND_RUSH'; this.eventTimer = 3.0; this.eventBanner = 'BLIND RUSH!'; this.eventBannerTimer = 2.0; audio.eventAnnounce();
      } else if (this.score > 1500 && r < 0.10) {
        this.currentEvent = 'SCORE_SURGE'; this.eventTimer = 5.0; this.eventBanner = 'SCORE SURGE!'; this.eventBannerTimer = 2.0; audio.eventAnnounce();
      } else if (this.score > 1000 && r < 0.15) {
        this.currentEvent = 'GAUNTLET'; this.gauntletRemaining = 5; this.eventBanner = 'GAUNTLET!'; this.eventBannerTimer = 2.0; audio.eventAnnounce();
      } else if (this.score > 500 && r < 0.23) {
        this.currentEvent = 'TIME_WARP'; this.eventTimer = 4.0; this.eventBanner = 'TIME WARP!'; this.eventBannerTimer = 2.0; audio.eventAnnounce();
      }
    }

    if (this.currentEvent === 'GAUNTLET') {
      if (this.gauntletRemaining > 0) {
        this.gauntletRemaining--;
        const lane = Math.floor(Math.random()*3);
        this.obstacles.push({
          id: Math.random(), type: OT.FAST, lane, y: -50,
          width: this.width * 0.20, height: this.height * 0.04,
          passed: false, nearMissTriggered: false, movingTime: 0, phantomOpacity: 1,
          isGauntletLast: this.gauntletRemaining === 0
        });
        this.nextSpawnDistance = this.distanceTraveled + 150;
        return;
      }
    }

    if (this.score > 1000 && Math.random() < 0.1) {
      const safeLane = Math.floor(Math.random()*3);
      this.obstacles.push({
        id: Math.random(), type: OT.LASER, lane: 1, safeLane, y: -50,
        width: this.width, height: 10,
        passed: false, nearMissTriggered: false, movingTime: 0, phantomOpacity: 1
      });
      return;
    }

    const isHard   = this.score > 2000 || this.riskPhase !== 'IDLE'; // Risk Mode: harder obstacle patterns
    const isMedium = this.score >  500  || this.riskPhase !== 'IDLE';

    const archetypes = ['SINGLE','GATE'];
    if (isMedium) archetypes.push('MOVING','DOUBLE');
    if (isHard)   archetypes.push('PHANTOM','FAST','DIAGONAL');

    const arch = archetypes[Math.floor(Math.random() * archetypes.length)];

    const spawn = (type, lane, yOff = 0) => {
      this.obstacles.push({
        id: Math.random(), type, lane,
        y: -50 - yOff,
        width:  this.width  * 0.20,
        height: this.height * 0.04,
        passed: false, nearMissTriggered: false,
        movingTime: 0, phantomOpacity: 0.8
      });
    };

    if      (arch === 'SINGLE')   spawn(OT.STATIC,  Math.floor(Math.random()*3));
    else if (arch === 'GATE')     spawn(OT.GATE,    Math.floor(Math.random()*3));
    else if (arch === 'MOVING')   spawn(OT.MOVING,  Math.floor(Math.random()*3));
    else if (arch === 'PHANTOM')  spawn(OT.PHANTOM, Math.floor(Math.random()*3));
    else if (arch === 'FAST')     spawn(OT.FAST,    Math.floor(Math.random()*3));
    else if (arch === 'DOUBLE') {
      const safe = Math.floor(Math.random()*3);
      [0,1,2].filter(l => l !== safe).forEach(l => spawn(OT.STATIC, l));
    } else if (arch === 'DIAGONAL') {
      const start = Math.random() > 0.5 ? 0 : 2;
      const step  = start === 0 ? 1 : -1;
      for (let i = 0; i < 3; i++) spawn(OT.STATIC, start + i*step, i * this.height * 0.15);
    }

    audio.spawn();
  }

  _die() {
    this.state      = 'DEATH';
    this.deathTimer = 0.4;
    this.shakeTime  = 0.5;

    // Cleanly cancel any in-progress Dynamic Event so it doesn't bleed into GAMEOVER/MENU
    this.dynPhase = 'IDLE';
    this.dynType = null;
    this.dynIntensity = 0;
    this.dynWarningTimer = 0;
    this.glitchInverted = false;

    // Cleanly cancel Risk Mode / portals as well
    this.riskPhase = 'IDLE';
    this.riskIntensity = 0;
    this.riskTimer = 0;
    this.portals = [];

    for (let i = 0; i < 24; i++) {
      const angle = (Math.PI * 2 / 24) * i;
      const spd   = 200 + Math.random() * 400;
      this._spawnParticle(this.playerX, this.playerY, Math.cos(angle) * spd, Math.sin(angle) * spd, 1.0, '#00ffff');
    }
    audio.gameOver();
  }

  _checkCollisions() {
    if (this.invulnTimer > 0) return;
    const pSize = Math.max(20, Math.min(60, this.width * 0.04));
    const pR = {
      left:   this.playerX - pSize/2, right: this.playerX + pSize/2,
      top:    this.playerY - pSize/2, bottom: this.playerY + pSize/2
    };

    for (const obs of this.obstacles) {
      if (obs.passed) continue;

      let ox = this._laneX(obs.lane);
      if (obs.type === OT.MOVING) {
        ox += Math.sin(obs.movingTime) * (this.width / 3);
        ox  = Math.max(this.width/6, Math.min(this.width*5/6, ox));
      }

      const oR = {
        left:   ox - obs.width/2,  right: ox + obs.width/2,
        top:    obs.y - obs.height/2, bottom: obs.y + obs.height/2
      };
      
      if (obs.type === OT.LASER) {
        if (pR.top < obs.y + 5 && pR.bottom > obs.y - 5) {
          const gapX = this._laneX(obs.safeLane);
          const gapLeft = gapX - this.width * 0.12;
          const gapRight = gapX + this.width * 0.12;
          if (pR.left < gapLeft || pR.right > gapRight) {
            this._die(); return;
          } else {
            if (!obs.passed) {
               obs.passed = true;
               this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this.currentEvent === 'TIME_WARP' ? 2 : 1);
               this.obstaclesDodged++;
            }
          }
        }
        continue;
      }

      if (pR.left < oR.right && pR.right > oR.left &&
          pR.top  < oR.bottom && pR.bottom > oR.top) {

        if (obs.type === OT.PHANTOM && obs.phantomOpacity < 0.2) continue;

        if (obs.type === OT.GATE) {
          obs.passed = true;
          this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this.currentEvent === 'TIME_WARP' ? 2 : 1);
          this.obstaclesDodged++;
          this.texts.push({id: Math.random(), text: '+50', x: this.playerX, y: this.playerY - 40, color: '#00ff88', life: 1});
          this._flash('#00ff88', 0.15);
          continue;
        }

        this._die();
        return;
      }

      // Near-miss detection
      if (!obs.nearMissTriggered && obs.y > this.playerY - pSize && obs.y < this.playerY + pSize) {
        if (obs.type !== OT.GATE && obs.type !== OT.PHANTOM && obs.type !== OT.LASER) {
          const distX = Math.abs(this.playerX - ox);
          const colDist = obs.width/2 + pSize/2;
          if (distX > colDist && distX < colDist + 50) {
            obs.nearMissTriggered = true;
            this.nearMissCount++;
            this.score += 50 * this.combo * (this.currentEvent === 'SCORE_SURGE' ? 3 : this.currentEvent === 'TIME_WARP' ? 2 : 1);
            this.texts.push({id: Math.random(), text: '+NEAR MISS', x: this.playerX, y: this.playerY - 40, color: '#00ff88', life: 1});
            audio.nearMiss();
            for(let k=0; k<8; k++) {
               const angle = Math.random() * Math.PI * 2;
               const spd = 100 + Math.random() * 100;
               this._spawnParticle(ox + (distX > 0 ? -obs.width/2 : obs.width/2), obs.y, Math.cos(angle)*spd, Math.sin(angle)*spd, 0.5, '#00ff88');
            }
            this._awardXP(8, this.playerX, this.playerY - 64);
          }
        }
      }
    }
  }

  // ── Dynamic Events: update ────────────────────────────────────────────────
  _dynDuration(type) {
    if (type === 'GLITCH')    return 4 + Math.random() * 2;
    if (type === 'BLACKOUT')  return 5 + Math.random() * 2.5;
    if (type === 'SPEEDRUSH') return 4 + Math.random() * 2;
    return 4;
  }

  _beginDynEvent(type) {
    this.dynType  = type;
    this.dynPhase = 'WARNING';
    this.dynIntensity = 0;
    if (type === 'GLITCH') {
      this.dynWarningTimer = 1.3;
      this.eventBanner = 'GLITCH INCOMING';
      audio.glitchStingIn();
    } else if (type === 'BLACKOUT') {
      this.dynWarningTimer = 0.9;
      this.eventBanner = 'BLACKOUT';
      audio.blackoutIn();
    } else {
      this.dynWarningTimer = 0.6;
      this.eventBanner = 'SPEED RUSH!';
      audio.rushWarn();
    }
    this.eventBannerTimer = 1.4;
  }

  _onDynActivate(type) {
    if (type === 'GLITCH') {
      this.glitchInverted = true;
      this._rollGlitchSlices();
      audio.glitchZap();
    } else if (type === 'BLACKOUT') {
      audio.blackoutHum();
    } else if (type === 'SPEEDRUSH') {
      audio.rushIn();
    }
  }

  _rollGlitchSlices() {
    this.glitchSlices = Array.from({length: 8}, () => ({
      y: Math.random() * this.height,
      h: 3 + Math.random() * 18,
      dx: (Math.random() - 0.5) * 50,
      color: Math.random() < 0.5 ? '#ff00ff' : '#00ffff'
    }));
  }

  _updateDynamicEvents(dt) {
    if (this.dynPhase === 'IDLE') {
      if (!this.currentEvent && this.riskPhase === 'IDLE' && this.gameTime > this.nextDynEventTime) {
        const pick = Math.random();
        if (pick < 0.34) this._beginDynEvent('GLITCH');
        else if (pick < 0.67) this._beginDynEvent('BLACKOUT');
        else this._beginDynEvent('SPEEDRUSH');
      }
      return;
    }

    if (this.dynPhase === 'WARNING') {
      this.dynWarningTimer -= dt;
      if (this.dynType === 'GLITCH' && Math.random() < 0.35) audio.glitchWarnBlip();
      if (this.dynWarningTimer <= 0) {
        this.dynPhase = 'ACTIVE';
        this.dynTimer = this._dynDuration(this.dynType);
        this._onDynActivate(this.dynType);
      }
      return;
    }

    if (this.dynPhase === 'ACTIVE') {
      this.dynIntensity = Math.min(1, this.dynIntensity + dt * 3.5); // smooth activation
      this.dynTimer -= dt;

      if (this.dynType === 'GLITCH') {
        if (Math.random() < 0.22) this._rollGlitchSlices();
        if (Math.random() < 0.10) audio.glitchZap();
      } else if (this.dynType === 'BLACKOUT') {
        if (Math.random() < 0.02) audio.blackoutHum();
      } else if (this.dynType === 'SPEEDRUSH') {
        if (Math.random() < 0.06) audio.rushPulse();
      }

      if (this.dynTimer <= 0) {
        this.dynPhase = 'ENDING';
        if (this.dynType === 'GLITCH') this.glitchInverted = false;
        audio.glitchStingOut();
      }
      return;
    }

    if (this.dynPhase === 'ENDING') {
      this.dynIntensity = Math.max(0, this.dynIntensity - dt * 2.5); // smooth ending
      if (this.dynIntensity <= 0) {
        this.dynPhase = 'IDLE';
        this.dynType = null;
        this.nextDynEventTime = this.gameTime + 20 + Math.random() * 25; // rare
      }
    }
  }

  // ── Risk / Reward Portal: spawn, move, collect ────────────────────────────
  _maybeSpawnPortal() {
    // Portals are optional bonus objects - never spawn one during another big system
    if (this.riskPhase !== 'IDLE' || this.currentEvent || this.dynPhase !== 'IDLE') return;
    if (this.distanceTraveled < this.nextPortalDistance) return;

    const lane = Math.floor(Math.random() * 3);
    this.portals.push({
      id: Math.random(), lane, y: -90,
      radius: Math.max(30, this.width * 0.09),
      pulsePhase: Math.random() * Math.PI * 2
    });
    this.nextPortalDistance = this.distanceTraveled + 1000 + Math.random() * 600;
    audio.portalHum();
  }

  _updatePortals(dt, spd) {
    const pSize = Math.max(20, Math.min(60, this.width * 0.04));
    for (let i = this.portals.length - 1; i >= 0; i--) {
      const p = this.portals[i];
      p.y += spd * dt;
      p.pulsePhase += dt * 4;

      // Enter the portal: player overlaps its core -> triggers Risk Mode
      const ox = this._laneX(p.lane);
      const dx = this.playerX - ox, dy = this.playerY - p.y;
      if (Math.sqrt(dx * dx + dy * dy) < p.radius * 0.65 + pSize * 0.35) {
        this.portals.splice(i, 1);
        this._enterRiskMode();
        continue;
      }

      // Ignored: simply scrolls off screen, game continues normally
      if (p.y > this.height + 150) this.portals.splice(i, 1);
    }
  }

  _enterRiskMode() {
    this.riskPhase = 'ACTIVE';
    this.riskTimer = 8 + Math.random() * 3; // limited time
    this.riskIntensity = 0;                  // ramps up smoothly
    this.riskScoreMult = Math.random() < 0.5 ? 2 : 3;
    this.eventBanner = `RISK MODE x${this.riskScoreMult}!`;
    this.eventBannerTimer = 1.6;
    this._flash('#aa00ff', 0.45);
    audio.portalEnter();
  }

  _updateRiskMode(dt) {
    if (this.riskPhase === 'ACTIVE') {
      this.riskIntensity = Math.min(1, this.riskIntensity + dt * 3); // smooth activation
      this.riskTimer -= dt;
      if (Math.random() < 0.05) audio.riskPulse();
      if (this.riskTimer <= 0) {
        this.riskPhase = 'ENDING';
        audio.riskEnd();
      }
    } else if (this.riskPhase === 'ENDING') {
      this.riskIntensity = Math.max(0, this.riskIntensity - dt * 2); // smooth return to normal
      if (this.riskIntensity <= 0) this.riskPhase = 'IDLE';
    }
  }

  update(dt) {
    if (this.levelUpTimer > 0) this.levelUpTimer -= dt;
    if (this.settingsConfirmingReset) {
      this.settingsResetTimer -= dt;
      if (this.settingsResetTimer <= 0) this.settingsConfirmingReset = false;
    }

    if (this.state === 'MENU') {
      this.gridYOffset += 100 * dt;
      this._updateParticles(dt);
      this._updateTexts(dt);
      this._updateSpeedLines(dt);
      this._updateMenuDemo(dt);
      this._updateMenuHover();
      return;
    }

    if (this.state === 'GAMEOVER') {
      this.gridYOffset += 100 * dt;
      this._updateParticles(dt);
      this._updateTexts(dt);
      this._updateSpeedLines(dt);
      this._updateGameOverAnim(dt);
      this._updateGameOverHover();
      return;
    }

    if (this.state === 'SHOP') {
      this.gridYOffset += 60 * dt;
      this._updateParticles(dt);
      this._updateTexts(dt);
      this._updateSpeedLines(dt);
      this.shopPreviewRot += dt * 0.6;
      if (this.purchaseAnim) {
        this.purchaseAnim.timer -= dt;
        if (this.purchaseAnim.timer <= 0) this.purchaseAnim = null;
      }
      this._updateShopHover();
      return;
    }

    if (this.state === 'STATISTICS' || this.state === 'ACHIEVEMENTS' ||
        this.state === 'SETTINGS'   || this.state === 'CHALLENGES') {
      this.gridYOffset += 60 * dt;
      this._updateParticles(dt);
      this._updateTexts(dt);
      this._updateSpeedLines(dt);
      this._updatePanelHover();
      return;
    }

    if (this.state === 'DEATH') {
      this.speedMult   = 0.3;
      this.deathTimer -= dt;
      this.shakeTime  -= dt;
      this._updateParticles(dt);
      this._updateTexts(dt);
      this._updateSpeedLines(dt);
      if (this.deathTimer <= 0) {
        this.state = 'GAMEOVER';
        this.gameOverStartTime = Date.now();
        if (this.score > this.highScore) {
          this.highScore = Math.floor(this.score);
          localStorage.setItem('neonRunnerHighScore', this.highScore.toString());
          this.newRecord = true;
          audio.highScore();
        }

        // Persist this run's totals into the player profile
        this.profile.totalDistance += this.distanceTraveled;
        this.profile.totalPlayTime += this.gameTime;
        if (Math.floor(this.score) > this.profile.highestScore) {
          this.profile.highestScore = Math.floor(this.score);
        }
        this.profile.save();

        if (this.newRecord) {
          this._awardXP(150, this.width/2, this.height/2 - 60);
        }

        this._updateDailyChallenges();
        this.motivationalMessage = this._getMotivationalMessage();
        this.gameOverScoreDisplay = 0;
        this.gameOverCoinsDisplay = 0;
        this.gameOverXPDisplay = 0;
        this.gameOverRewardBurstDone = false;
        this.gameOverHoverBtn = -1;
      }
      return;
    }

    // PLAYING
    if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
    this._updateDynamicEvents(dt);

    this._updateRiskMode(dt);

    this.speedMult = 1;
    if (this.currentEvent === 'TIME_WARP') this.speedMult = 0.4;
    if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') this.speedMult *= (1 + 0.9 * this.dynIntensity);
    if (this.riskPhase !== 'IDLE') this.speedMult *= (1 + 0.55 * this.riskIntensity); // Risk Mode: faster gameplay
    
    const spd = this.speed * this.speedMult;
    const prevScore = this.score;
    
    let scoreMultiplier = 1;
    if (this.currentEvent === 'TIME_WARP') scoreMultiplier = 2;
    if (this.currentEvent === 'SCORE_SURGE') scoreMultiplier = 3;
    if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') scoreMultiplier *= (1 + this.dynIntensity);
    if (this.riskPhase !== 'IDLE') scoreMultiplier *= (1 + (this.riskScoreMult - 1) * this.riskIntensity); // Risk Mode: 2x/3x, ramps smoothly
    
    this.score += spd * dt * 0.05 * scoreMultiplier;
    this.speed += dt * 5;
    
    if (this.score > this.highScore && this.score > 100) this.isHighScoring = true;

    if (Math.floor(this.score / 100) > Math.floor(prevScore / 100)) audio.scoreMilestone();

    this.gameTime += dt;

    // Survival XP: a steady trickle for simply staying alive, awarded once per whole second
    this.survivalXPAccum += dt;
    if (this.survivalXPAccum >= 1) {
      const wholeSecs = Math.floor(this.survivalXPAccum);
      this.survivalXPAccum -= wholeSecs;
      this._awardXP(2 * wholeSecs, this.playerX, this.playerY - 34, false);
    }
    
    // Inversion Logic
    if (!this.inverted && this.gameTime > this.nextInvertTime) {
      if (this.inversionState === 'IDLE') {
        this.inversionState = 'WARNING';
        this.inversionWarningTimer = 2.0;
        this.inversionBeepCount = 0;
      }
    }
    
    if (this.inversionState === 'WARNING') {
      if (this.inversionWarningTimer <= 2.0 && this.inversionBeepCount === 0) { audio.alarm(800, 0.15); this.inversionBeepCount++; }
      if (this.inversionWarningTimer <= 1.5 && this.inversionBeepCount === 1) { audio.alarm(800, 0.15); this.inversionBeepCount++; }
      if (this.inversionWarningTimer <= 1.0 && this.inversionBeepCount === 2) { audio.alarm(800, 0.15); this.inversionBeepCount++; }

      this.inversionWarningTimer -= dt;
      if (this.inversionWarningTimer <= 0) {
        this.inversionState = 'ACTIVE';
        this.inverted = true;
        this.invertTimer = 3 + Math.random() * 2;
        this._flash('#ff0000', 0.4);
        audio.inversionStart();
      }
    } else if (this.inversionState === 'ACTIVE') {
      this.invertTimer -= dt;
      if (this.invertTimer <= 0) {
        this.inversionState = 'IDLE';
        this.inverted = false;
        this.nextInvertTime = this.gameTime + 8 + Math.random() * 12;
        this._flash('#ffffff', 0.2);
        audio.restoreChime();
        this.texts.push({ id: Math.random(), text: 'Controls Restored', x: this.width/2, y: this.height/2, color: '#00ff88', life: 2.0 });
      }
    }

    this.comboCounter += dt;
    if (this.comboCounter > 5.0) {
      if (this.combo < 5) {
        this.combo++;
        if (this.combo > this.maxComboReached) this.maxComboReached = this.combo;
        if (this.combo === 3 || this.combo === 5) {
           this.ripple = { active: true, radius: 0, maxRadius: 1000, x: this.playerX, y: this.playerY };
           audio.comboRipple();
        }
        audio.comboUp();
      }
      this.comboCounter = 0;
    }
    
    if (this.ripple && this.ripple.active) {
       this.ripple.radius += 1500 * dt;
       if (this.ripple.radius > this.ripple.maxRadius) this.ripple.active = false;
    }

    if (this.flashTimer > 0) this.flashTimer -= dt;
    if (this.eventBannerTimer > 0) this.eventBannerTimer -= dt;
    if (this.currentEvent) {
       this.eventTimer -= dt;
       if (this.eventTimer <= 0 && this.currentEvent !== 'GAUNTLET') {
         this.currentEvent = null;
       }
    }

    this.gridYOffset += spd * dt;
    this._updateSpeedLines(dt);

    // Spring physics movement
    this.targetX  = this._laneX(this.playerLane);
    const springK = 200;
    const damp = 12;
    const force = (this.targetX - this.playerX) * springK;
    this.playerVX = this.playerVX + (force - this.playerVX * damp) * dt;
    this.playerX += this.playerVX * dt;
    this.playerAngle = Math.max(-0.26, Math.min(0.26, this.playerVX / 5000));
    
    if (Math.abs(this.targetX - this.playerX) < 5 && Math.abs(this.playerVX) < 50 && !this.settledInLane) {
      this.settledInLane = true;
      this.playerScale = 1.2;
    } else if (Math.abs(this.targetX - this.playerX) > 20) {
      this.settledInLane = false;
    }
    if (this.playerScale > 1.0) {
      this.playerScale -= dt * 2;
      if (this.playerScale < 1.0) this.playerScale = 1.0;
    }

    this.playerTrail.push({x: this.playerX, y: this.playerY, angle: this.playerAngle, life: 0.2});
    if (this.playerTrail.length > 5) this.playerTrail.shift();
    for (const pt of this.playerTrail) pt.life -= dt;

    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const obs = this.obstacles[i];
      let moveSpd = spd;
      if (obs.type === OT.FAST) moveSpd *= 2.5;

      obs.y += moveSpd * dt;
      if (obs.type === OT.MOVING) obs.movingTime += dt * 3;
      if (obs.type === OT.PHANTOM && obs.y > this.height * 0.2)
        obs.phantomOpacity = Math.max(0, obs.phantomOpacity - dt * 2);

      if (!obs.passed && obs.y > this.playerY + this.height * 0.05) {
        obs.passed = true;
        if (obs.type !== OT.LASER && obs.type !== OT.GATE) this.obstaclesDodged++;
        if (obs.isGauntletLast) {
           this.score += 500;
           this.texts.push({id: Math.random(), text: '+500 GAUNTLET SURVIVED!', x: this.width/2, y: this.playerY - 60, color: '#ffd700', life: 2});
           this.currentEvent = null;
        }
      }
      if (obs.y > this.height + 100) this.obstacles.splice(i, 1);
    }

    this._updatePortals(dt, spd);
    this._maybeSpawnPortal();

    this._updateCoins(dt, spd);
    this._maybeSpawnCoin();

    this.distanceTraveled += spd * dt;
    if (this.distanceTraveled > this.nextSpawnDistance) {
      this._spawnWave();
      // Risk Mode: more obstacle density (shorter gaps between spawns)
      const riskDensity = this.riskPhase !== 'IDLE' ? (1 + 0.7 * this.riskIntensity) : 1;
      const baseDist = Math.max(150, (600 - this.score * 0.1) / riskDensity);
      this.nextSpawnDistance = this.distanceTraveled + baseDist + Math.random() * 200;
    }

    // Objectives tracking
    for (const obj of this.activeObjectives) {
      if (!obj.completed) {
        if (obj.get() >= obj.target) {
          obj.completed = true;
          obj.flashTimer = 1.0;
          this.score += 200;
          audio.objectiveComplete();
          this.texts.push({id: Math.random(), text: 'OBJECTIVE COMPLETE!', x: this.width/2, y: this.playerY - 80, color: '#ffd700', life: 1.5});
          this._awardXP(60, this.width/2, this.playerY - 104);
        }
      } else {
        if (obj.flashTimer > 0) obj.flashTimer -= dt;
      }
    }

    this._updateParticles(dt);
    this._updateTexts(dt);
    this._checkCollisions();
  }

  _updateParticles(dt) {
    for (let i = 0; i < this.particles.length; i++) {
      const p = this.particles[i];
      if (p.life > 0) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
      }
    }
  }

  _updateTexts(dt) {
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.y -= 50 * dt; t.life -= dt;
      if (t.life <= 0) this.texts.splice(i, 1);
    }
  }

  _updateSpeedLines(dt) {
    const spd = (this.state === 'MENU' ? 200 : this.speed) * this.speedMult;
    for (const sl of this.speedLines) sl.y += spd * sl.speed * dt;
  }

  // ── Main Menu: animated player demo + decorative traffic ─────────────────
  _updateMenuDemo(dt) {
    this.menuGlowPhase += dt;

    // Auto-weave the player between lanes for a lively showcase animation
    this.menuTimer += dt;
    if (this.menuTimer > 1.6) {
      this.menuTimer = 0;
      let next = Math.floor(Math.random() * 3);
      if (next === this.playerLane) next = (next + 1) % 3;
      this.playerLane = next;
    }
    this.targetX = this._laneX(this.playerLane);
    const springK = 200, damp = 12;
    const force = (this.targetX - this.playerX) * springK;
    this.playerVX = this.playerVX + (force - this.playerVX * damp) * dt;
    this.playerX += this.playerVX * dt;
    this.playerAngle = Math.max(-0.26, Math.min(0.26, this.playerVX / 5000));
    this.playerTrail.push({ x: this.playerX, y: this.playerY, angle: this.playerAngle, life: 0.2 });
    if (this.playerTrail.length > 5) this.playerTrail.shift();
    for (const pt of this.playerTrail) pt.life -= dt;

    // Decorative obstacles drifting down in the background (purely visual, no collisions)
    this.menuDecorTimer += dt;
    if (this.menuDecorTimer > 0.9 && this.menuDecor.length < 8) {
      this.menuDecorTimer = 0;
      this.menuDecor.push({
        lane: Math.floor(Math.random() * 3), y: -60,
        w: this.width * 0.14, h: this.height * 0.03,
        kind: Math.random() < 0.5 ? 'STATIC' : 'MOVING', mt: 0
      });
    }
    for (let i = this.menuDecor.length - 1; i >= 0; i--) {
      const o = this.menuDecor[i];
      o.y += 150 * dt;
      if (o.kind === 'MOVING') o.mt += dt * 2;
      if (o.y > this.height + 80) this.menuDecor.splice(i, 1);
    }
  }

  _updateMenuHover() {
    const ML = this._getMenuLayout();
    this.menuHoverPlay = this._pointInRect(this.mouseX, this.mouseY, ML.playBtn);
    this.menuHoverSecondary = ML.secButtons.findIndex(b => this._pointInRect(this.mouseX, this.mouseY, b));
  }

  // ── Game Over: animated counters, hover, revive ───────────────────────────
  _updateGameOverAnim(dt) {
    const elapsed = (Date.now() - this.gameOverStartTime) / 1000;
    const dur = 1.1;
    const t = Math.min(1, elapsed / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    this.gameOverScoreDisplay = Math.floor(this.score * eased);
    this.gameOverCoinsDisplay = Math.floor(this.sessionCoinsEarned * eased);
    this.gameOverXPDisplay    = Math.floor(this.sessionXPEarned * eased);

    if (t >= 1 && !this.gameOverRewardBurstDone) {
      this.gameOverRewardBurstDone = true;
      audio.scoreMilestone();
      const GL = this._getGameOverLayout();
      const cx = GL.panelX + GL.panelW * 0.5;
      const cy = GL.panelY + GL.panelH * 0.30;
      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 60 + Math.random() * 140;
        this._spawnParticle(cx, cy, Math.cos(angle) * spd, Math.sin(angle) * spd, 0.8, '#ffd700');
      }
    }
  }

  _updateGameOverHover() {
    const GL = this._getGameOverLayout();
    this.gameOverHoverBtn = GL.buttons.findIndex(b => this._pointInRect(this.mouseX, this.mouseY, b));
  }

  _getMotivationalMessage() {
    if (this.newRecord) return { text: 'NEW PERSONAL BEST!', color: '#ffd700' };

    const deficit = this.highScore - Math.floor(this.score);
    if (deficit > 0 && deficit <= 50) {
      return { text: `Only ${deficit} points away from a new record!`, color: '#00ffff' };
    }

    const need = this.profile.xpForLevel(this.profile.level);
    const remaining = need - this.profile.xp;
    if (remaining > 0 && remaining <= need * 0.2) {
      return { text: `Almost Level ${this.profile.level + 1}!`, color: '#66ddff' };
    }

    const generic = ['One more run!', 'You can beat that!', 'Keep the streak going!', 'Push further next time!'];
    const idx = Math.floor(this.gameOverStartTime / 1000) % generic.length;
    return { text: generic[idx], color: '#ff00ff' };
  }

  _continueRun() {
    const cost = 50;
    if (this.profile.coins < cost) {
      this._flash('#ff0044', 0.3);
      audio.alarm(300, 0.15);
      return;
    }
    this.profile.coins -= cost;
    this.profile.save();

    // Clear the field and revive the player with a brief grace period
    this.obstacles = [];
    this.portals = [];
    this.coins = [];
    this.state = 'PLAYING';
    this.deathTimer = 0;
    this.shakeTime = 0;
    this.invulnTimer = 1.5;
    this._flash('#00ffff', 0.4);
    audio.restoreChime();
    this.texts.push({ id: Math.random(), text: 'REVIVED!', x: this.width / 2, y: this.height / 2, color: '#00ffff', life: 1.5 });
  }

  // ── Daily Challenges: progress evaluation (checked once per completed run) ──
  _updateDailyChallenges() {
    this.profile.ensureDailyChallenges();
    const sessionStats = {
      score: Math.floor(this.score),
      coins: this.sessionCoinsEarned,
      combo: this.maxComboReached,
      survive: Math.floor(this.gameTime),
      dodge: this.obstaclesDodged,
      nearmiss: this.nearMissCount
    };
    let anyCompleted = false;
    for (const ch of this.profile.daily.challenges) {
      if (ch.completed) continue;
      const val = sessionStats[ch.type] || 0;
      if (val > ch.progress) ch.progress = val;
      if (ch.progress >= ch.target) {
        ch.completed = true;
        anyCompleted = true;
        this.profile.addCoins(DAILY_REWARD_COINS);
        this._awardXP(DAILY_REWARD_XP, this.width / 2, this.height * 0.5, false);
      }
    }
    if (anyCompleted) this.profile.save();
  }

  // ── Generic side panels: hover ────────────────────────────────────────────
  _updatePanelHover() {
    const L = this._getPanelLayout();
    this.panelHoverBack = this._pointInRect(this.mouseX, this.mouseY, L.backBtn);
    if (this.state === 'SETTINGS') {
      const rows = this._getSettingsRows();
      this.panelHoverItem = rows.findIndex(r => this._pointInRect(this.mouseX, this.mouseY, r));
    } else {
      this.panelHoverItem = -1;
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  draw(ctx) {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, this.width, this.height);
    
    this._drawBackground(ctx);
    if (this.state === 'MENU') this._drawMenuNeonBG(ctx);

    ctx.save();
    if (this.shakeTime > 0) {
      const amt = (this.shakeTime / 0.5) * 8;
      ctx.translate((Math.random() - 0.5) * amt, (Math.random() - 0.5) * amt);
    }

    // Dynamic Event camera work: Speed Rush intensifies the camera; Glitch adds jitter cuts
    if (this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE') {
      const camAmt = this.dynIntensity * 4;
      ctx.translate((Math.random() - 0.5) * camAmt, (Math.random() - 0.5) * camAmt);
      const zoom = 1 + 0.035 * this.dynIntensity;
      ctx.translate(this.width/2, this.height/2);
      ctx.scale(zoom, zoom);
      ctx.translate(-this.width/2, -this.height/2);
    }
    if (this.dynType === 'GLITCH' && this.dynPhase === 'ACTIVE' && Math.random() < 0.06 * this.dynIntensity) {
      ctx.translate((Math.random() - 0.5) * 30 * this.dynIntensity, 0);
    }

    const isOverlayPanel = this.state === 'SHOP' || this.state === 'STATISTICS' ||
      this.state === 'ACHIEVEMENTS' || this.state === 'SETTINGS' || this.state === 'CHALLENGES';

    this._drawGrid(ctx);
    this._drawSpeedLines(ctx);
    if (this.state === 'MENU') {
      this._drawMenuDecor(ctx);
    } else if (!isOverlayPanel) {
      this._drawObstacles(ctx);
      this._drawPortals(ctx);
      this._drawCoins(ctx);
    }
    
    if (this.currentEvent === 'BLIND_RUSH') {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, this.width, this.height);
    }
    if (this.currentEvent === 'TIME_WARP') {
      ctx.fillStyle = 'rgba(128,0,255,0.15)';
      ctx.fillRect(0, 0, this.width, this.height);
    }
    
    if (this.state === 'PLAYING' || this.state === 'MENU') this._drawPlayer(ctx);
    this._drawParticles(ctx);

    // Dynamic Event overlays (drawn above player/particles, below the global flash/ripple)
    this._drawGlitchOverlay(ctx);
    this._drawBlackoutOverlay(ctx);
    this._drawRiskOverlay(ctx);

    if (this.inverted && this.state === 'PLAYING') {
      ctx.fillStyle = 'rgba(255,30,0,0.12)';
      ctx.fillRect(0, 0, this.width, this.height);
    }
    if (this.flashTimer > 0) {
      ctx.globalAlpha = this.flashTimer / 0.3;
      ctx.fillStyle   = this.flashColor;
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.globalAlpha = 1;
    }
    
    if (this.ripple && this.ripple.active) {
       ctx.beginPath();
       ctx.arc(this.ripple.x, this.ripple.y, this.ripple.radius, 0, Math.PI*2);
       const alpha = Math.max(0, 1 - (this.ripple.radius / this.ripple.maxRadius));
       ctx.strokeStyle = `rgba(0, 255, 255, ${alpha})`;
       ctx.lineWidth = 5;
       ctx.stroke();
    }
    
    ctx.restore();

    if (this.state === 'DEATH') {
      const progress = 1 - (this.deathTimer / 0.4);
      ctx.globalCompositeOperation = 'saturation';
      ctx.fillStyle  = 'black';
      ctx.globalAlpha = progress;
      ctx.fillRect(0, 0, this.width, this.height);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgba(0,0,0,${progress * 0.5})`;
      ctx.fillRect(0, 0, this.width, this.height);
    }
    
    if (this.isHighScoring && this.state === 'PLAYING') {
       const grad = ctx.createLinearGradient(0,0,this.width,this.height);
       grad.addColorStop(0, 'rgba(255, 215, 0, 0.5)');
       grad.addColorStop(1, 'rgba(255, 215, 0, 0.1)');
       ctx.lineWidth = 30;
       ctx.strokeStyle = grad;
       ctx.strokeRect(15, 15, this.width - 30, this.height - 30);
    }

    this._drawLevelUpEffect(ctx);
    this._drawUI(ctx);
  }

  _drawBackground(ctx) {
    for (const n of this.nebulae) {
       const grad = ctx.createRadialGradient(n.x * this.width, n.y * this.height, 0, n.x * this.width, n.y * this.height, n.r * this.width);
       grad.addColorStop(0, n.color + '0.08)');
       grad.addColorStop(1, 'rgba(0,0,0,0)');
       ctx.fillStyle = grad;
       ctx.fillRect(0, 0, this.width, this.height);
       n.x = (n.x + n.vx * 0.01) % 1; if (n.x < 0) n.x += 1;
       n.y = (n.y + n.vy * 0.01) % 1; if (n.y < 0) n.y += 1;
    }
    ctx.fillStyle = '#ffffff';
    for (const s of this.stars) {
       s.phase += 0.02;
       ctx.globalAlpha = 0.3 + 0.7 * ((Math.sin(s.phase) + 1)/2);
       ctx.fillRect(s.x % this.width, s.y % this.height, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  _drawGrid(ctx) {
    const vpX = this.width / 2;
    const vpY = 0;
    ctx.strokeStyle = 'rgba(68,0,170,0.15)';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    for (let i = 0; i <= 6; i++) {
       const tx = this.width * (i / 6);
       ctx.beginPath();
       ctx.moveTo(vpX, vpY);
       ctx.lineTo(tx, this.height);
       ctx.stroke();
    }

    // Lane dividers (Risk Mode swaps in a hot pink/magenta lighting scheme)
    const riskLit = this.riskPhase !== 'IDLE';
    const laneColor = riskLit ? '#ff0066' : (this.inverted ? '#ff5500' : '#4400aa');
    ctx.strokeStyle = laneColor;
    ctx.lineWidth   = riskLit ? 2 + 2 * this.riskIntensity : 2;
    ctx.shadowBlur  = riskLit ? 10 + 10 * this.riskIntensity : 10;
    ctx.shadowColor = laneColor;
    for (let i = 1; i <= 2; i++) {
      const x = this.width * (i / 3);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.height); ctx.stroke();
    }
    // Horizontal scroll lines
    ctx.shadowBlur  = 0;
    ctx.strokeStyle = riskLit ? `rgba(255,0,100,${0.3 + 0.2*this.riskIntensity})` : 'rgba(68,0,170,0.3)';
    const spacing   = this.height / 10;
    for (let i = 0; i <= 11; i++) {
      const y = (this.gridYOffset + i * spacing) % (this.height + spacing) - spacing;
      if (y > 0 && y < this.height) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke();
      }
    }
  }

  _drawSpeedLines(ctx) {
    const rush = this.dynType === 'SPEEDRUSH' && this.dynPhase !== 'IDLE';
    const boost = rush ? this.dynIntensity : 0;
    ctx.strokeStyle = rush ? `rgba(0,255,255,${0.10 + 0.35*boost})` : 'rgba(255,255,255,0.10)';
    ctx.lineWidth   = 2 + boost * 3;
    for (const sl of this.speedLines) {
      const sx = sl.x % this.width;
      const sy = sl.y % this.height;
      const len = sl.length * (1 + boost * 1.5);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + len); ctx.stroke();
    }
  }

  // ── Main Menu: dynamic neon backdrop + decorative traffic ────────────────
  _drawMenuNeonBG(ctx) {
    const t = this.menuGlowPhase;
    ctx.save();
    for (let i = 0; i < 2; i++) {
      const hue = (t * 20 + i * 180) % 360;
      const cx = this.width * (0.3 + 0.4 * i) + Math.sin(t * 0.3 + i) * this.width * 0.08;
      const cy = this.height * 0.30 + Math.cos(t * 0.25 + i) * this.height * 0.06;
      const r = this.width * 0.35;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, `hsla(${hue},100%,60%,0.10)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, this.width, this.height);
    }
    ctx.restore();
  }

  _drawMenuDecor(ctx) {
    for (const o of this.menuDecor) {
      let ox = this._laneX(o.lane);
      if (o.kind === 'MOVING') {
        ox += Math.sin(o.mt) * (this.width / 3);
        ox = Math.max(this.width / 6, Math.min(this.width * 5 / 6, ox));
      }
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.strokeStyle = '#ff0055'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055'; ctx.lineWidth = 2;
      ctx.strokeRect(ox - o.w / 2, o.y - o.h / 2, o.w, o.h);
      ctx.restore();
    }
  }

  // ── Cosmetics: shape paths ────────────────────────────────────────────────
  _pathForShape(ctx, shapeId, s) {
    ctx.beginPath();
    switch (shapeId) {
      case 'circle':
        ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
        break;
      case 'triangle':
        ctx.moveTo(0, -s * 0.62); ctx.lineTo(s * 0.55, s * 0.45); ctx.lineTo(-s * 0.55, s * 0.45);
        ctx.closePath();
        break;
      case 'diamond':
        ctx.moveTo(0, -s * 0.62); ctx.lineTo(s * 0.5, 0); ctx.lineTo(0, s * 0.62); ctx.lineTo(-s * 0.5, 0);
        ctx.closePath();
        break;
      case 'hex':
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 3 * i - Math.PI / 6;
          const px = Math.cos(a) * s * 0.56, py = Math.sin(a) * s * 0.56;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
      case 'star': {
        const spikes = 5, outerR = s * 0.6, innerR = s * 0.26;
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const a = Math.PI / spikes * i - Math.PI / 2;
          const px = Math.cos(a) * r, py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
      }
      case 'square':
      default:
        ctx.rect(-s / 2, -s / 2, s, s);
        break;
    }
  }

  // ── Cosmetics: unified shape+skin+color+glow renderer (used by player & shop previews) ──
  _drawCosmeticPlayer(ctx, cx, cy, size, cos, angle = 0, scale = 1, animT = 0) {
    const colorDef = COSMETICS.colors.find(c => c.id === cos.colors) || COSMETICS.colors[0];
    let mainColor = colorDef.hex;
    if (cos.glows === 'rainbow') mainColor = `hsl(${(animT * 80) % 360},100%,60%)`;

    let glowBlur = 20;
    if (cos.glows === 'sharp') glowBlur = 8;
    else if (cos.glows === 'pulse') glowBlur = 14 + 10 * Math.sin(animT * 6);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.rotate(Math.PI / 4 + angle);

    ctx.shadowBlur  = glowBlur;
    ctx.shadowColor = mainColor;
    ctx.lineWidth   = cos.glows === 'sharp' ? 4 : 3;
    ctx.strokeStyle = mainColor;

    if (cos.glows === 'double') {
      ctx.save();
      ctx.scale(1.4, 1.4);
      ctx.globalAlpha = 0.3;
      this._pathForShape(ctx, cos.shapes, size);
      ctx.stroke();
      ctx.restore();
    }

    this._pathForShape(ctx, cos.shapes, size);

    if (cos.skins === 'wireframe') {
      ctx.globalAlpha = 1;
      ctx.stroke();
    } else if (cos.skins === 'glass') {
      ctx.globalAlpha = 0.18; ctx.fillStyle = mainColor; ctx.fill();
      ctx.globalAlpha = 1; ctx.stroke();
      ctx.save();
      this._pathForShape(ctx, cos.shapes, size);
      ctx.clip();
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#ffffff';
      ctx.fillRect(-size / 2, -size / 2, size * 0.28, size);
      ctx.restore();
    } else if (cos.skins === 'circuit') {
      ctx.globalAlpha = 0.15; ctx.fillStyle = mainColor; ctx.fill();
      ctx.globalAlpha = 1; ctx.stroke();
      ctx.save();
      this._pathForShape(ctx, cos.shapes, size);
      ctx.clip();
      ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(-size / 2, i * size / 5); ctx.lineTo(size / 2, i * size / 5); ctx.stroke();
      }
      ctx.restore();
    } else if (cos.skins === 'hologram') {
      const flicker = 0.5 + 0.5 * Math.sin(animT * 10);
      ctx.globalAlpha = 0.15; ctx.fillStyle = mainColor; ctx.fill();
      ctx.globalAlpha = 0.5 + 0.4 * flicker; ctx.stroke();
      ctx.save();
      this._pathForShape(ctx, cos.shapes, size);
      ctx.clip();
      ctx.globalAlpha = 0.25;
      for (let y = -size / 2; y < size / 2; y += 4) {
        ctx.beginPath(); ctx.moveTo(-size / 2, y); ctx.lineTo(size / 2, y); ctx.stroke();
      }
      ctx.restore();
    } else {
      // solid (default) - reproduces the game's original look exactly
      ctx.globalAlpha = 0.2; ctx.fillStyle = mainColor; ctx.fill();
      ctx.globalAlpha = 1; ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ── Cosmetics: trail styles ───────────────────────────────────────────────
  _drawTrail(ctx, cos) {
    const size = Math.max(20, Math.min(60, this.width * 0.04));
    const colorDef = COSMETICS.colors.find(c => c.id === cos.colors) || COSMETICS.colors[0];
    const color = cos.glows === 'rainbow' ? `hsl(${(this.gameTime * 80) % 360},100%,60%)` : colorDef.hex;

    if (cos.trails === 'ribbon') {
      const pts = this.playerTrail.filter(p => p.life > 0);
      if (pts.length >= 2) {
        ctx.save();
        ctx.strokeStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        for (let i = 1; i < pts.length; i++) {
          ctx.globalAlpha = Math.max(0, pts[i].life / 0.2) * 0.5;
          ctx.lineWidth = size * 0.5 * (i / pts.length);
          ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
        }
        ctx.restore();
      }
      return;
    }

    if (cos.trails === 'sparkle') {
      for (const pt of this.playerTrail) {
        if (pt.life <= 0) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life / 0.2);
        ctx.fillStyle = color; ctx.shadowBlur = 8; ctx.shadowColor = color;
        for (let k = 0; k < 2; k++) {
          const ang = Math.random() * Math.PI * 2, r = Math.random() * size * 0.4;
          ctx.beginPath();
          ctx.arc(pt.x + Math.cos(ang) * r, pt.y + Math.sin(ang) * r, 1.5 + Math.random() * 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      return;
    }

    if (cos.trails === 'comet') {
      for (let i = 0; i < this.playerTrail.length; i++) {
        const pt = this.playerTrail[i];
        if (pt.life <= 0) continue;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(Math.PI / 4 + pt.angle);
        const stretch = 1 + (this.playerTrail.length - i) * 0.15;
        ctx.scale(1 / stretch, stretch);
        ctx.globalAlpha = Math.max(0, pt.life / 0.2) * 0.35;
        ctx.fillStyle = color; ctx.shadowBlur = 12; ctx.shadowColor = color;
        this._pathForShape(ctx, cos.shapes, size);
        ctx.fill();
        ctx.restore();
      }
      return;
    }

    if (cos.trails === 'dotted') {
      for (const pt of this.playerTrail) {
        if (pt.life <= 0) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.life / 0.2);
        ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      return;
    }

    // classic (default) - fading shape copies, matches the original trail exactly
    for (const pt of this.playerTrail) {
      if (pt.life <= 0) continue;
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.scale(this.playerScale, this.playerScale);
      ctx.rotate(Math.PI / 4 + pt.angle);
      ctx.globalAlpha = Math.max(0, pt.life / 0.2) * 0.3;
      ctx.fillStyle = color;
      this._pathForShape(ctx, cos.shapes, size);
      ctx.fill();
      ctx.restore();
    }
  }

  _drawPlayer(ctx) {
    const size = Math.max(20, Math.min(60, this.width * 0.04));
    const cos = this.profile.equipped;

    this._drawTrail(ctx, cos);
    this._drawCosmeticPlayer(ctx, this.playerX, this.playerY, size, cos, this.playerAngle, this.playerScale, this.gameTime);
  }

  _drawObstacles(ctx) {
    for (const obs of this.obstacles) {
      ctx.save();
      let ox = this._laneX(obs.lane);
      if (obs.type === OT.MOVING) {
        ox += Math.sin(obs.movingTime) * (this.width / 3);
        ox  = Math.max(this.width/6, Math.min(this.width*5/6, ox));
      }

      let alpha = obs.type === OT.PHANTOM ? obs.phantomOpacity : 1;
      ctx.globalAlpha = alpha;

      if (obs.type === OT.LASER) {
        const gapX = this._laneX(obs.safeLane);
        const gapLeft = gapX - this.width * 0.15;
        const gapRight = gapX + this.width * 0.15;
        
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff00ff';
        ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, obs.y); ctx.lineTo(gapLeft, obs.y);
        ctx.moveTo(gapRight, obs.y); ctx.lineTo(this.width, obs.y);
        ctx.stroke();
        
        const sweepX = (this.gameTime * 1500) % this.width;
        if (sweepX < gapLeft || sweepX > gapRight) {
           ctx.fillStyle = '#fff';
           ctx.beginPath(); ctx.arc(sweepX, obs.y, 4, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
        continue;
      }

      const color = obs.type === OT.GATE ? '#00ff88' : obs.type === OT.FAST ? '#ff5500' : '#ff0055';
      ctx.shadowBlur  = 15; ctx.shadowColor = color;
      ctx.strokeStyle = color; ctx.fillStyle = color;

      if (obs.type === OT.STATIC) {
        const pulse = 0.5 + 0.5 * Math.sin(this.gameTime * Math.PI * 2 / 0.8);
        ctx.globalAlpha = alpha * (0.4 + 0.4 * pulse);
        ctx.fillRect(ox - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 2;
        ctx.strokeRect(ox - obs.width/2, obs.y - obs.height/2, obs.width, obs.height);
      } else if (obs.type === OT.MOVING) {
        ctx.translate(ox, obs.y);
        ctx.rotate(obs.movingTime * 2);
        ctx.lineWidth = 2;
        const s = obs.width * 0.6;
        ctx.globalAlpha = alpha * 0.3;
        ctx.fillRect(-s/2, -s/2, s, s);
        ctx.globalAlpha = alpha;
        ctx.strokeRect(-s/2, -s/2, s, s);
      } else if (obs.type === OT.PHANTOM) {
        ctx.translate(ox, obs.y);
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i;
          const hx = Math.cos(angle) * obs.width/2;
          const hy = Math.sin(angle) * obs.height * 1.5;
          if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.globalAlpha = alpha * 0.3; ctx.fill();
        ctx.globalAlpha = alpha; ctx.lineWidth = 2; ctx.stroke();
        ctx.setLineDash([]);
      } else if (obs.type === OT.FAST) {
        ctx.translate(ox, obs.y);
        ctx.beginPath();
        ctx.moveTo(-obs.width/2, -obs.height);
        ctx.lineTo(0, obs.height);
        ctx.lineTo(obs.width/2, -obs.height);
        ctx.lineTo(0, -obs.height/2);
        ctx.closePath();
        ctx.globalAlpha = alpha * 0.4; ctx.fill();
        ctx.globalAlpha = alpha; ctx.lineWidth = 2; ctx.stroke();
